<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- VIRAL! The Creator's Journey to Fame — Texas Nomad Games edition. Plays on one screen, or online with friends through TNG rooms. -->
</head><body style="margin:0">
<title>VIRAL! Game Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen game table — neon board on the left, turn console on the right; stacks on phones. Single dark look, like the board. */
:root{
  color-scheme: dark;
  --bg:#0a0916; --panel:#13112a; --panel2:#1b1838; --line:#2d2958; --fg:#f3f1ff; --muted:#aaa5cf;
  --berna:#ff8a1c; --purple:#7b2cf5;
  --v:#18d45b; --i:#23aaff; --r:#b84cff; --a:#ffd35a; --l:#ff4a3d;
  --good:#51cf66; --bad:#fa5252;
  --display:'Bebas Neue', 'Oswald', Impact, sans-serif;
  --ui:'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:17px;line-height:1.35;margin:0}
button{font-family:var(--ui);font-weight:700;font-size:16px;letter-spacing:.04em;color:var(--fg);background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;text-transform:uppercase}
button:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,.spc:focus-visible{outline:3px solid var(--berna);outline-offset:2px}
button.primary{background:var(--berna);border-color:var(--berna);color:#1a0c02}
button.good{background:#123a22;border-color:var(--good)}
button.bad{background:#3a1216;border-color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
input,select{font-family:var(--ui);font-size:16px;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:6px 8px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%;padding-inline:16px;box-sizing:border-box}
header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-size:40px;letter-spacing:.04em;line-height:1;display:flex}
.logo span:nth-child(1){color:var(--v)}.logo span:nth-child(2){color:var(--i)}.logo span:nth-child(3){color:var(--r)}.logo span:nth-child(4){color:var(--a)}.logo span:nth-child(5){color:var(--l)}.logo span:nth-child(6){color:var(--berna)}
.tagline{color:var(--muted);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:14px}
.top .spacer{flex:1}
.round{font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.roomtag{white-space:nowrap;font-weight:700;letter-spacing:.1em;padding:3px 10px;border-radius:8px;border:2px solid var(--i);color:var(--i)}
.table{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;padding-block:14px;min-height:0}
.boardwrap{position:relative;min-height:0;min-width:0;background:radial-gradient(ellipse at 50% 35%,#2a2350 0%,#0d0b1f 70%);border:1px solid var(--line);border-radius:16px;overflow:hidden}
#board{display:block;width:3200px;height:2110px}
.side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto;padding-right:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.box h2{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.06em;margin:0 0 8px;color:var(--muted)}
.turnhead{display:flex;align-items:center;gap:12px}
.turnhead .who{font-family:var(--display);font-size:34px;line-height:1;letter-spacing:.03em}
.turnhead .where{color:var(--muted);font-weight:600}
.lvl{display:inline-block;padding:2px 8px;border-radius:6px;font-weight:700;font-size:14px;letter-spacing:.06em;color:#140a24}
.console{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;margin-top:12px}
#die{width:96px;height:96px}
#die.rolling{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
.prompt{display:flex;flex-direction:column;gap:8px;min-width:0}
.prompt .ptitle{font-weight:700;font-size:19px}
.prompt .ptext{color:var(--muted)}
.prompt .btns{display:flex;flex-wrap:wrap;gap:8px}
.timer{font-family:var(--display);font-size:28px;color:var(--a);letter-spacing:.04em}
.cardwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.promptbox{width:100%;box-sizing:border-box;background:var(--panel);border:2px dashed var(--berna);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.promptbox .lab{font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--berna)}
.promptbox .q{font-weight:700;font-size:19px}
.promptbox .q.script{font-weight:600;font-size:17px;line-height:1.4;white-space:normal}
.promptbox .style{font-weight:700;color:var(--a,#ffd35a);font-size:15px;letter-spacing:.04em}
.promptbox .how{color:var(--muted);font-size:15px}
.promptbox .ans{color:var(--good);font-weight:700}
.players{display:flex;flex-direction:column;gap:6px}
.pl{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:10px;border:1px solid transparent}
.pl.cur{border-color:var(--berna);background:#ff8a1c14}
.pl .nm{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .sub{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.pl .fol{font-family:var(--display);font-size:26px;letter-spacing:.03em;font-variant-numeric:tabular-nums;text-align:right}
.gear{display:flex;gap:3px}
.gear i{width:10px;height:10px;border-radius:3px;background:#2d2958;display:block}
.gear i.t1{background:#b98b5c}.gear i.t2{background:#a9c6e8}.gear i.t3{background:#ffd35a}
.chip{display:inline-block;padding:0 6px;border-radius:5px;font-weight:700;font-size:13px;letter-spacing:.05em;background:var(--panel2);border:1px solid var(--line);color:var(--fg)}
.chip.warn{border-color:var(--bad);color:#ffb3b3}.chip.ok{border-color:var(--good);color:#b9f5c4}.chip.net{border-color:var(--i);color:#a8dcff}
.log{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;font-size:15px;font-variant-numeric:tabular-nums}
.log div{color:var(--muted)}.log div b{color:var(--fg)}.log div.host{color:var(--a)}
details.box summary{cursor:pointer;font-family:var(--display);font-size:24px;letter-spacing:.06em;color:var(--muted);list-style:none}
details.box summary::-webkit-details-marker{display:none}
.hostgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.hostgrid .full{grid-column:1/-1}
.hostgrid label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-weight:600}
.hostgrid label.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.info{color:var(--muted);font-size:15px}
.overlay{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;background:rgba(10,9,22,.86);overflow:auto;z-index:5}
.setup{background:var(--panel);border:2px solid var(--berna);border-radius:18px;box-shadow:0 0 24px rgba(255,138,28,.35);padding:20px;width:min(780px,100%);box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
.setup h1{font-family:var(--display);font-weight:400;font-size:44px;letter-spacing:.04em;margin:0;line-height:1}
.setup h3{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.05em;margin:6px 0 0;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button[aria-pressed="true"]{border-color:var(--berna);color:var(--berna)}
.seats{display:flex;flex-direction:column;gap:8px}
.seat{display:grid;grid-template-columns:36px minmax(0,1fr) 170px 120px;gap:8px;align-items:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opts label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-weight:600}
.opts label.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg)}
.code{font-family:var(--display);font-size:40px;letter-spacing:.2em;color:var(--i)}
.seatpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.seatpick button{display:flex;align-items:center;gap:8px;text-transform:none;font-size:17px}
.winov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,9,22,.85);z-index:6;padding:16px}
.winov .panel{text-align:center;border:3px solid var(--a);border-radius:20px;padding:30px;background:var(--panel);box-shadow:0 0 40px rgba(255,211,90,.5);max-width:520px}
.winov h2{font-family:var(--display);font-weight:400;font-size:72px;margin:0;color:var(--a);line-height:1}
@media (max-width: 1000px){
  .app{height:auto}
  .table{grid-template-columns:1fr}
  .side{overflow:visible}
  .seat{grid-template-columns:36px minmax(0,1fr)}
  .seat select{grid-column:2}
}
@media (prefers-reduced-motion: reduce){ #die.rolling{animation:none} }

/* ---- tabletop 3D view ---- */
.stage{position:absolute;inset:0;overflow:hidden;perspective:1300px;perspective-origin:50% 45%}
.boardwrap{min-height:min(78vh,820px)}
.plane{position:absolute;left:0;top:0;width:3200px;height:2110px;transform-origin:0 0;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,.7,.3,1)}
.plane::after{content:"";position:absolute;inset:-40px;border-radius:40px;box-shadow:0 60px 120px rgba(0,0,0,.65),0 0 0 22px #3a2a1a,0 0 0 26px #1a120a;transform:translateZ(-2px);pointer-events:none}
#pieces{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.piece{position:absolute;width:0;height:0;transform-style:preserve-3d;transition:left .17s ease-out,top .17s ease-out}
.piece .shadowdisc{position:absolute;left:-34px;top:-12px;width:68px;height:24px;border-radius:50%;background:radial-gradient(#000c,#0000 70%)}
.piece .stand{position:absolute;left:-46px;bottom:0;width:92px;height:150px;transform-origin:50% 100%;transform:rotateX(calc(-1 * var(--tilt,0deg)));transform-style:preserve-3d}
.piece .bob{position:absolute;inset:0}
.piece.hop .bob{animation:hop3 .17s ease-out}
@keyframes hop3{0%,100%{transform:translateY(0)}50%{transform:translateY(-38px)}}
.piece .disc{position:absolute;left:0;top:0;width:92px;height:92px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.piece .post{position:absolute;left:40px;top:84px;width:12px;height:46px;background:linear-gradient(90deg,#b07d00,#ffe08a,#b07d00);border-radius:4px}
.piece .base{position:absolute;left:14px;bottom:0;width:64px;height:22px;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#ffe9a8,#c9a227 60%,#7a5600);box-shadow:0 3px 0 #4a3400}
.piece.cur .disc{filter:drop-shadow(0 0 14px #ff8a1c) drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.camctl{position:absolute;right:10px;top:10px;z-index:5;display:flex;gap:6px}
.camctl button{padding:6px 10px;font-size:13px;background:rgba(9,8,22,.82);border:1px solid #4a4580;color:#f3f1ff;border-radius:8px}
.camctl button[aria-pressed="true"]{border-color:#ff8a1c;color:#ffb066}
@media (max-width:560px){ .camctl{left:8px;right:8px;top:8px;justify-content:flex-end;flex-wrap:wrap;gap:4px} .camctl button{padding:5px 7px;font-size:11px} }
/* city (WebGL) view */
#city{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;z-index:1}
#city:active{cursor:grabbing}
.stage.citymode .plane{opacity:0;pointer-events:none}
.cityfx{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.cfloat{position:absolute;transform:translate(-50%,-100%);font-family:"Bebas Neue",Impact,sans-serif;font-size:34px;letter-spacing:1px;-webkit-text-stroke:5px #14121f;paint-order:stroke fill;animation:cfloat 1.6s ease-out forwards;white-space:nowrap}
@keyframes cfloat{0%{opacity:0;margin-top:10px}15%{opacity:1}70%{opacity:1}100%{opacity:0;margin-top:-60px}}
.cityload{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;padding:10px 16px;border-radius:10px;background:rgba(9,8,22,.85);border:1px solid #4a4580;color:#f3f1ff;font-size:14px}
.cityhint{position:absolute;left:10px;bottom:10px;z-index:5;padding:5px 9px;border-radius:8px;background:rgba(9,8,22,.7);color:#d9d6ee;font-size:12px;pointer-events:none}
@media (prefers-reduced-motion: reduce){ .cfloat{animation:none;opacity:1} }
/* dice cube */
#die{width:96px;height:96px;perspective:420px}
.cube{position:relative;width:96px;height:96px;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.75,.25,1)}
.cube .f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cube .f svg{display:block}
.cube .f1{transform:translateZ(47px)}.cube .f6{transform:rotateY(180deg) translateZ(47px)}.cube .f3{transform:rotateY(90deg) translateZ(47px)}
.cube .f4{transform:rotateY(-90deg) translateZ(47px)}.cube .f5{transform:rotateX(90deg) translateZ(47px)}.cube .f2{transform:rotateX(-90deg) translateZ(47px)}
.cube .core{position:absolute;inset:6px;background:#ff8a1c;transform:translateZ(0)}
#die.toss{animation:tossup 1s cubic-bezier(.3,.7,.4,1)}
@keyframes tossup{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-60px) scale(1.25)}62%{transform:translateY(0) scale(1)}76%{transform:translateY(-12px) scale(1.05)}100%{transform:translateY(0) scale(1)}}
@media (prefers-reduced-motion: reduce){ .plane,.cube,.piece{transition:none!important} #die.toss,.piece.hop .bob{animation:none!important} }

/* ---- motion & effects ---- */
#die{width:96px;height:96px;transform-origin:50% 60%}
#die.rolling{animation:none}

@keyframes toss{0%{transform:translateY(0) rotate(0) scale(1)}30%{transform:translateY(-46px) rotate(250deg) scale(1.15)}62%{transform:translateY(0) rotate(520deg) scale(1)}76%{transform:translateY(-10px) rotate(600deg) scale(1.05,.95)}100%{transform:translateY(0) rotate(720deg) scale(1)}}
#die.land{animation:land .45s ease-out}
@keyframes land{0%{transform:scale(1.28);filter:drop-shadow(0 0 0 #ffd35a)}50%{filter:drop-shadow(0 0 18px #ffd35a)}100%{transform:scale(1);filter:drop-shadow(0 0 0 #ffd35a)}}
#board .tok{transition:transform .17s ease-out}
#board .tok.hop .hopper{animation:hop .17s ease-out}
@keyframes hop{0%{transform:translateY(0)}50%{transform:translateY(-26px)}100%{transform:translateY(0)}}
#curRing{animation:ringpulse 1.2s ease-in-out infinite}
@keyframes ringpulse{0%,100%{stroke-width:5;stroke-opacity:1}50%{stroke-width:12;stroke-opacity:.45}}
#board .spc{transition:filter .2s}
#board .spc:hover{filter:brightness(1.15) drop-shadow(0 0 10px #fff)}
.flipwrap{perspective:1000px}
.flipcard{position:relative;transform-style:preserve-3d}
.flipcard.go{animation:flip .6s cubic-bezier(.2,.8,.3,1)}
@keyframes flip{0%{transform:rotateY(180deg) translateY(-20px) scale(.85)}60%{transform:rotateY(-12deg) scale(1.03)}100%{transform:rotateY(0) scale(1)}}
.flipcard .face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flipcard .backface{position:absolute;inset:0;transform:rotateY(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;background:#ff8a1c;padding:6px;box-sizing:border-box}
.flipcard .backface div{height:100%;border-radius:10px;background:radial-gradient(circle at 50% 40%,#3a1670,#1c0b38);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-family:var(--display);color:#fff;letter-spacing:.06em}
.flipcard .backface b{font-size:58px;line-height:.9;font-weight:400}
.flipcard .backface span{font-size:22px;border-top:2px solid #ff8a1c;border-bottom:2px solid #ff8a1c;padding:2px 10px}
.fxtext{font-family:var(--display),Impact,sans-serif;font-size:70px;font-weight:400;paint-order:stroke;stroke:#140a24;stroke-width:10px;stroke-linejoin:round;animation:floatup 1.5s ease-out forwards;pointer-events:none}
@keyframes floatup{0%{opacity:0;transform:translateY(16px) scale(.6)}14%{opacity:1;transform:translateY(-8px) scale(1.12)}100%{opacity:0;transform:translateY(-150px) scale(1)}}
.fxtext{transform-box:fill-box;transform-origin:center}
.banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:7;pointer-events:none;text-align:center;padding:14px 34px 16px;border-radius:18px;background:rgba(9,8,22,.9);border:4px solid var(--bc);box-shadow:0 0 40px var(--bc),inset 0 0 22px rgba(255,255,255,.08);animation:bannerin 1.5s cubic-bezier(.2,.9,.3,1.2) forwards;white-space:nowrap}
.banner b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,76px);line-height:1;letter-spacing:.05em;color:var(--bc);text-shadow:0 0 18px var(--bc)}
.banner span{display:block;margin-top:6px;font-weight:700;font-size:clamp(14px,1.6vw,20px);letter-spacing:.1em;color:#f3f1ff}
@keyframes bannerin{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-6deg)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(1deg)}22%{transform:translate(-50%,-50%) scale(1) rotate(0)}82%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}
.banner.glitch b{animation:glitch .18s steps(2) 5}
@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-4px,2px);text-shadow:4px 0 #00e5ff,-4px 0 #ff2e63}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,1px);text-shadow:-4px 0 #00e5ff,4px 0 #ff2e63}100%{transform:translate(0)}}
.boardwrap.shake{animation:boardshake .5s}
@keyframes boardshake{0%,100%{transform:translate(0)}20%{transform:translate(-9px,3px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,2px)}80%{transform:translate(4px,-2px)}}
.boardwrap .flash{position:absolute;inset:0;z-index:6;pointer-events:none;animation:flash .6s ease-out forwards}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.pl .fol{transition:color .3s}
@media (prefers-reduced-motion: reduce){ #die.toss,#die.land,.flipcard.go,.banner,.fxtext,.boardwrap.shake,#curRing,#board .tok.hop .hopper{animation:none!important} #board .tok{transition:none} }

/* ================= PLAY-FIRST LAYOUT: the board never leaves the screen ================= */
.app{height:100vh;height:100dvh}
header.top{padding-block:6px}
.logo{font-size:34px}
.table{grid-template-columns:minmax(0,1fr) 340px;padding-block:10px}
.banner{z-index:9}
/* action dock: whose turn + what to do, right on the board */
.dock{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(880px,calc(100% - 24px));z-index:4;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 16px;border-radius:18px;background:rgba(12,10,30,.9);border:1px solid #4a4580;box-shadow:0 12px 34px rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.dock:empty{display:none}
.dock.yourturn{border-color:var(--berna);animation:yt 1.8s ease-in-out infinite}
@keyframes yt{0%,100%{box-shadow:0 12px 34px rgba(0,0,0,.55),0 0 0 0 rgba(255,138,28,0)}50%{box-shadow:0 12px 34px rgba(0,0,0,.55),0 0 26px 2px rgba(255,138,28,.6)}}
.dock .dwho{display:flex;align-items:center;gap:10px;min-width:0;max-width:250px}
.dock .dwho>svg{flex:none}
.dock .who{font-family:var(--display);font-size:30px;line-height:1;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .where{color:var(--muted);font-weight:600;font-size:14px;line-height:1.2;margin:2px 0 3px}
.dock .prompt{gap:6px}
.dock .ptitle{font-family:var(--display);font-weight:400;font-size:27px;line-height:1.05;letter-spacing:.03em}
.dock .ptext{font-size:15px;line-height:1.25}
.dock .btns button{font-size:18px;padding:11px 18px;border-radius:12px}
.dock .btns button.primary{box-shadow:0 0 18px rgba(255,138,28,.5)}
.dock .dmini{width:64px;height:64px}
.dock .dmini #die{transform:scale(.667);transform-origin:0 0}
.dock .wait{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600}
.dock .wait i{width:8px;height:8px;border-radius:50%;background:var(--berna);animation:dots 1s infinite alternate}
.dock .wait i:nth-child(2){animation-delay:.2s}.dock .wait i:nth-child(3){animation-delay:.4s}
@keyframes dots{from{opacity:.25}to{opacity:1}}
/* card pop-up on the board */

<script>// VIRAL! — Texas Nomad Games online rooms.
// Gives the game the same room interface it uses on claude.ai (join / emit / on / presence / onPeers / peers / leave),
// backed by the TNG Railway WebSocket relay at /viral-live. The game engine is unchanged.
(function () {
  if (window.claude && window.claude.use) return; // running inside claude.ai — use the built-in rooms

  function relayBase() {
    try { var q = new URLSearchParams(location.search).get('relay'); if (q) return q.replace(/\/$/, ''); } catch (e) {}
    var h = location.hostname;
    if (/\.up\.railway\.app$/.test(h) || h === 'localhost' || h === '127.0.0.1') return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
    return 'wss://tng-live-production.up.railway.app';
  }

  function setStatus(s) {
    window.VIRAL_NET_STATUS = s;
    var tag = document.getElementById('roomTag');
    if (tag && !tag.hidden) tag.classList.toggle('offline', s !== 'online');
    var b = document.getElementById('netBanner');
    if (b) b.hidden = s === 'online' || s === 'closed';
  }

  function join(name) {
    return new Promise(function (resolve, reject) {
      var url = relayBase() + '/viral-live?room=' + encodeURIComponent(name);
      var handlers = {}, peerFns = [], peers = [], myId = null, myPresence = null;
      var ws = null, closed = false, settled = false, queue = [], retry = 0, pingT = null;

      function rawSend(obj) {
        var s = JSON.stringify(obj);
        if (ws && ws.readyState === 1) { try { ws.send(s); return; } catch (e) {} }
        queue.push(s); if (queue.length > 50) queue.shift();
      }
      function connect() {
        if (closed) return;
        try { ws = new WebSocket(url); } catch (e) { fail(); return; }
        ws.onopen = function () {
          retry = 0;
          if (myPresence) ws.send(JSON.stringify({ t: 'presence', p: myPresence }));
          while (queue.length) ws.send(queue.shift());
          clearInterval(pingT); pingT = setInterval(function () { rawSend({ t: 'ping' }); }, 20000);
        };
        ws.onmessage = function (ev) {
          var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
          if (m.t === 'welcome') {
            myId = m.id; peers = m.peers || []; setStatus('online');
            if (!settled) { settled = true; resolve(api); }
            else peerFns.forEach(function (fn) { try { fn({ joined: peers.filter(function (p) { return p.id !== myId; }), left: [], peers: peers }); } catch (e) {} });
          } else if (m.t === 'msg') {
            (handlers[m.topic] || []).slice().forEach(function (fn) { try { fn({ topic: m.topic, data: m.data, from: m.from, sameTab: false }); } catch (e) {} });
          } else if (m.t === 'peers') {
            peers = m.peers || [];
            peerFns.forEach(function (fn) { try { fn({ joined: m.joined || [], left: m.left || [], peers: peers }); } catch (e) {} });
          }
        };
        ws.onclose = function () { clearInterval(pingT); if (closed) return; fail(); };
        ws.onerror = function () {};
      }
      function fail() {
        if (!settled) { settled = true; closed = true; reject(new Error('Can’t reach the VIRAL room server.')); return; }
        setStatus('offline');
        var wait = Math.min(8000, 600 * Math.pow(1.7, retry++));
        setTimeout(connect, wait);
      }
      var api = {
        emit: function (topic, data) { if (closed) return Promise.reject(new Error('left')); rawSend({ t: 'emit', topic: topic, data: data }); return Promise.resolve(); },
        on: function (topic, fn) { (handlers[topic] = handlers[topic] || []).push(fn); return function () { handlers[topic] = (handlers[topic] || []).filter(function (f) { return f !== fn; }); }; },
        presence: function (p) { myPresence = p || {}; rawSend({ t: 'presence', p: myPresence }); return Promise.resolve(); },
        onPeers: function (fn) { peerFns.push(fn); return function () { peerFns = peerFns.filter(function (f) { return f !== fn; }); }; },
        peers: function () { return peers.map(function (p) { return { id: p.id, presence: p.presence || {}, self: p.id === myId }; }); },
        leave: function () { closed = true; clearInterval(pingT); setStatus('closed'); try { ws && ws.close(); } catch (e) {} return Promise.resolve(); }
      };
      setTimeout(function () { if (!settled) { settled = true; closed = true; try { ws && ws.close(); } catch (e) {} reject(new Error('timeout')); } }, 9000);
      connect();
    });
  }

  var room = { join: join };
  window.claude = { use: function (name) { return Promise.resolve(name === 'room' ? room : null); } };
})();
</script>

// ---------- sound: everything is synthesized with WebAudio, so there are no files to load ----------
const SFX=(()=>{
  let ctx=null, out=null, on=true, lastAt={};
  try{ on=localStorage.getItem('viral-sound')!=='off'; }catch(e){}
  function ensure(){ if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; try{ ctx=new AC(); }catch(e){ return null; }
      out=ctx.createGain(); out.gain.value=.55; const comp=ctx.createDynamicsCompressor(); out.connect(comp); comp.connect(ctx.destination); }

    if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to,t+d); if(o.vib){ const l=c.createOscillator(), lg=c.createGain(); l.frequency.value=o.vib; lg.gain.value=f*.03; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t+d); }
    const v=o.vol==null?.3:o.vol; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+(o.att||.008)); g.gain.exponentialRampToValueAtTime(.0008,t+d);
    let node=osc; if(o.lp){ const fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=o.lp; osc.connect(fl); node=fl; } node.connect(g); g.connect(out); osc.start(t); osc.stop(t+d+.05); }
  let nbuf=null; function noise(t,d,o={}){ const c=ctx; if(!nbuf){ nbuf=c.createBuffer(1,c.sampleRate*1.5,c.sampleRate); const a=nbuf.getChannelData(0); for(let i=0;i<a.length;i++) a[i]=Math.random()*2-1; }
    const src=c.createBufferSource(); src.buffer=nbuf; const f=c.createBiquadFilter(); f.type=o.type||'bandpass'; f.frequency.setValueAtTime(o.f||1800,t); if(o.to) f.frequency.exponentialRampToValueAtTime(o.to,t+d); f.Q.value=o.q||1.2;
    const g=c.createGain(); const v=o.vol==null?.25:o.vol; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0008,t+d); src.connect(f); f.connect(g); g.connect(out); src.start(t,Math.random()*.5); src.stop(t+d+.05); }
  const N=n=>440*Math.pow(2,(n-69)/12);

    roll(t){ for(let i=0;i<9;i++){ const k=t+i*.085+Math.random()*.03; noise(k,.05,{f:2400+Math.random()*1800,q:4,vol:.32}); tone(k,180+Math.random()*90,.04,{type:'triangle',vol:.1}); } },

    card(t){ noise(t,.28,{f:600,to:4200,q:.8,vol:.22}); tone(t+.18,N(88),.25,{type:'sine',vol:.08}); },

    sponsor(t){ noise(t,.06,{f:5000,q:2,vol:.25}); [88,95].forEach((n,i)=>tone(t+.05+i*.09,N(n),.45,{vol:.14})); },

    play(name){ if(!on||!ctx) return; const now=performance.now(); if(lastAt[name]&&now-lastAt[name]<70) return; lastAt[name]=now; try{ ensure(); LIB[name]&&LIB[name](ctx.currentTime+.01); }catch(e){} },
    unlock(){ if(on) ensure(); },

const bannerQ=[]; let bannerBusy=false;
function banner(title,sub,color,glitch){ if(!fxOn()) return; bannerQ.push([title,sub,color,glitch]); if(bannerQ.length>3) bannerQ.splice(0,bannerQ.length-3); if(!bannerBusy) nextBanner(); }

  const cols=['#18d45b','#23aaff','#b84cff','#ffd35a','#ff4a3d','#ff8a1c','#ffffff']; const P=[...Array(220)].map(()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,r:Math.random()*360,vr:(Math.random()-.5)*20,w:6+Math.random()*8,h:8+Math.random()*10,c:cols[rand(cols.length)]}));

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
let FORCE_DRAW=null;
function draw(which){
  if(FORCE_DRAW&&FORCE_DRAW[0]===which){ const id=FORCE_DRAW[1]; FORCE_DRAW=null; const c=(which==='V'?DATA.viral:DATA.challenge).find(x=>x.id===id); if(c) return c; }
  const key=which==='V'?'deckV':'deckC', src=which==='V'?DATA.viral:DATA.challenge;
  if(!S[key].length){S[key]=shuffle(src.map((_,i)=>i)); if(S.started) log(`${which==='V'?'Viral':'Challenge'} deck reshuffled.`);}
  return src[S[key].pop()];
}

function ask(p,opts){

    S.pid=(S.pid||0)+1;
    S.prompt={...opts, who:p?p.name:'Host', seat:p?p.id:'HOST', pid:S.pid}; renderPrompt(); pushState();
    if(p&&p.ai){ const v=opts.ai?opts.ai():opts.buttons[0].value; setTimeout(()=>{S.prompt=null;renderPrompt();res(v);}, opts.aiDelay!=null?opts.aiDelay:SPEED[S.settings.speed]); return; }
    resolver=v=>{resolver=null;S.prompt=null;stopTimer();renderPrompt();pushState();res(v);};
  });
}
let timerId=null, timerLeft=null, timerTotal=0;
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;} timerLeft=null;}
function paintTimer(){ document.querySelectorAll('.tring').forEach(e=>{ const tot=+e.dataset.t||timerTotal||1, left=timerLeft==null?tot:timerLeft; e.style.setProperty('--p',Math.max(0,left/tot)); e.classList.toggle('low',timerLeft!=null&&left<=10&&left>0); e.classList.toggle('done',timerLeft===0); const b=e.querySelector('b'); if(b) b.textContent=timerLeft===0?'TIME':left; });
  document.querySelectorAll('.tbtn').forEach(b=>b.textContent=timerLeft==null?`Start ${b.dataset.t}s timer`:timerLeft===0?'Restart timer':'Restart timer'); }
function startTimer(sec){ if(timerId) clearInterval(timerId); timerTotal=sec; timerLeft=sec; paintTimer();
  timerId=setInterval(()=>{ timerLeft=Math.max(0,timerLeft-1); paintTimer(); if(timerLeft>0&&timerLeft<=5) SFX.play('tick'); if(timerLeft<=0){ SFX.play('buzzer'); clearInterval(timerId); timerId=null; if(typeof banner==='function') banner("TIME'S UP!",'','#ff4a3d'); } },1000); }
const timerHTML=t=>`<div class="trow"><div class="tring" data-t="${t}"><b>${timerLeft==null?t:timerLeft}</b></div><button type="button" class="tbtn" data-t="${t}">Start ${t}s timer</button></div>`;

const CUBE_R={1:[0,0],6:[0,180],3:[0,-90],4:[0,90],5:[-90,0],2:[90,0]}; let cubeSpin=[0,0];

// ---------- effects ----------
function gain(p,base,why){const amt=Math.round(base*mult(p)); p.f+=amt; log(`<b>${esc(p.name)}</b> +${fmt(amt)} followers${why?' — '+esc(why):''}.`); return amt;}
async function blocked(p,kind,desc){
  if(p.shield){p.shield=false; log(`<b>${esc(p.name)}</b>'s protection blocks it (${esc(desc)}).`); return true;}
  const cost=SS_COST[kind];
  if(p.ss>=cost){
    const v=await ask(p,{title:'Block with Stream Strength?',text:`${desc}. Spend ${cost} of your ${p.ss} Stream Strength to block it?`,
      buttons:[{label:`Block (−${cost})`,value:'block',kind:'good'},{label:'Take it',value:'take'}],
      ai:()=>{ if(kind==='followers') return (p.f>0&&p.ss>=cost+2)?'block':'take'; return 'block';}});
    if(v==='block'){p.ss-=cost; log(`<b>${esc(p.name)}</b> spends ${cost} Stream Strength to block: ${esc(desc)}.`); return true;}
  }
  return false;
}
async function lose(p,base,why,noBlock){
  if(p.f<=0){log(`<b>${esc(p.name)}</b> has no followers to lose (${esc(why)}).`);return 0;}
  const raw=Math.round(base*mult(p)); const amt=Math.min(raw,Math.floor(p.f*S.settings.lossCap));
  if(!noBlock && await blocked(p,'followers',`Lose ${fmt(amt)} followers (${why})`)) return 0;
  p.f-=amt; if(amt>0) p.hits=(p.hits||0)+1; log(`<b>${esc(p.name)}</b> −${fmt(amt)} followers — ${esc(why)}${amt<raw?' (25% cap)':''}.`); return amt;}
async function missTurn(p,why,noBlock){ if(!noBlock && await blocked(p,'miss',`Miss next turn (${why})`)) return; p.skip++; p.hits=(p.hits||0)+1; log(`<b>${esc(p.name)}</b> will miss a turn — ${esc(why)}.`);}
async function moveBack(p,n,why,noBlock){ if(!noBlock && await blocked(p,'back',`Move back ${n} (${why})`)) return; const to=Math.max(floorPos(p),p.pos-n); p.pos=to; p.hits=(p.hits||0)+1; log(`<b>${esc(p.name)}</b> moves back to ${to} — ${esc(why)}.`); renderTokens();}
function moveForward(p,n,why){ const to=capMove(p,Math.min(120,p.pos+n)); p.pos=to; log(`<b>${esc(p.name)}</b> jumps to ${to} — ${esc(why)} (space doesn't trigger).`); renderTokens(); }
async function gearGain(p,slot,tier,why){const cur=p.gear[slot]||0;
  if(tier>cur){p.ss+=TIER_SS[tier]-TIER_SS[cur]; p.gear[slot]=tier; log(`<b>${esc(p.name)}</b> ${cur?'upgrades to':'gets'} ${TIER[tier]} ${SLOT_NAME[slot]}${why?' — '+esc(why):''}.`); return;}
  // No trading: already own it at this quality or better → take a BS piece for any empty slot instead.
  const miss=SLOTS.filter(s=>!p.gear[s]);
  if(!miss.length){ log(`<b>${esc(p.name)}</b> already has ${TIER[cur]} ${SLOT_NAME[slot]} and every slot is full — nothing new.`); return; }
  const s2=miss.length>1?await ask(p,{title:`Already have a ${TIER[cur]} ${SLOT_NAME[slot]}`,text:'Take a BS piece for any empty slot instead.',buttons:miss.map(s=>({label:SLOT_NAME[s],value:s})),ai:()=>miss[rand(miss.length)]}):miss[0];
  p.gear[s2]=1; p.ss+=1; log(`<b>${esc(p.name)}</b> already has ${TIER[cur]} ${SLOT_NAME[slot]} — takes a BS ${SLOT_NAME[s2]} instead.`);
}
// Equipment drop (E spaces, Risk It 6, "Random Equipment" cards): pick a slot you're missing; quality = your level (L1 BS, L2 Playing, L3 Serious).
// All 8 owned: upgrade any slot below that quality; already that good everywhere: +500 followers.
async function randomGear(p,why){ const t=level(p.pos); const miss=SLOTS.filter(s=>!p.gear[s]);
  const opts=miss.length?miss:SLOTS.filter(s=>(p.gear[s]||0)<t);
  if(!opts.length){ gain(p,500,why+' (your gear is already this good)'); return; }
  const slot=opts.length===1?opts[0]:await ask(p,{title:`${why}: pick your gear`,text:miss.length?`Pick a slot you're missing — you get a ${TIER[t]} piece.`:`You have all 8 — pick one to upgrade to ${TIER[t]}.`,buttons:opts.map(s=>({label:SLOT_NAME[s]+(p.gear[s]?' ('+TIER[p.gear[s]]+')':''),value:s})),ai:()=>opts[rand(opts.length)]});
  await gearGain(p,slot,t,why); }
async function missingGear(p,why){
  const miss=SLOTS.filter(s=>!p.gear[s]);
  if(!miss.length){ const weakest=SLOTS.reduce((a,s)=>(p.gear[s]<p.gear[a]?s:a),SLOTS[0]); if(p.gear[weakest]<3) await gearGain(p,weakest,p.gear[weakest]+1,why+' (all gear owned: upgrade)'); else gain(p,1000,why+' (maxed gear)'); return; }
  let slot=miss[0];
  if(miss.length>1) slot=await ask(p,{title:'Pick your missing gear',text:'Choose one item to add.',buttons:miss.map(s=>({label:SLOT_NAME[s],value:s})),ai:()=>miss[rand(miss.length)]});
  await gearGain(p,slot,1,why);
}
function sponsorship(p,{minLevel=2,reqGear=0,fallback=500,bonus=0,ssBonus=0,why}){
  const L=level(p.pos);
  if(L>=minLevel && gearCount(p)>=reqGear){p.sp++; log(`<b>${esc(p.name)}</b> signs a sponsorship — ${esc(why)}! (${p.sp} total)`,'good'); if(bonus) gain(p,bonus,why); if(ssBonus){p.ss+=ssBonus;} return true;}
  gain(p,fallback,why+(L<minLevel?' (not ready for sponsors yet)':' (need '+reqGear+'+ gear)')); return false;
}
const fb=s=>{const m=/(\d+)/.exec(s||''); return m?+m[1]:500;};

function cardById(kind,id){const src=kind==='viral'?DATA.viral:kind==='challenge'?DATA.challenge:DATA.cancel; return src.find(c=>c.id===id);}
async function resolveViral(p){
  const c=draw('V'); showCard('viral',c); log(`<b>${esc(p.name)}</b> draws Viral: <b>${esc(c.title)}</b>.`); await sleep(400);

    case 'GAIN_FOLLOWERS': gain(p,v,c.title); break;
    case 'LOSE_FOLLOWERS': await lose(p,v,c.title); break;
    case 'ADD_STATUS_EFFECT': p.shield=true; log(`<b>${esc(p.name)}</b> will ignore the next negative event.`); break;
    case 'MOVE_FORWARD': moveForward(p,v,c.title); break;

    case 'ADD_STREAM_STRENGTH': p.ss+=v; log(`<b>${esc(p.name)}</b> +${v} Stream Strength.`); break;
    case 'GAIN_RANDOM_EQUIPMENT': await randomGear(p,c.title); break;
    case 'GAIN_ANY_MISSING_EQUIPMENT': await missingGear(p,c.title); break;
    case 'DRAW_CANCELLATION_TABLE': await cancelTable(p); break;
    case 'CHOICE_RISK_CONTROVERSIAL_POST':{
      const ch=await ask(p,{title:'Controversial Post',text:'Delete it (nothing happens) or leave it up and roll: 4–6 = +3,000 followers, 1–3 = −2,000.',buttons:[{label:'Delete it',value:'del'},{label:'Leave it up',value:'up',kind:'primary'}],ai:()=>Math.random()<.5?'up':'del'});
      if(ch==='up'){const d=await rollDie(); if(d>=4) gain(p,3000,'Controversial Post went well'); else await lose(p,2000,'Controversial Post backfired');} else log(`<b>${esc(p.name)}</b> deletes the post.`); break;}
    case 'CHOICE_VIRAL_MOMENT':{
      const ch=await ask(p,{title:'VIRAL MOMENT',text:'Choose your reward.',buttons:[{label:'+5,000 followers',value:'f',kind:'primary'},{label:'Missing gear',value:'g'},{label:'Move ahead 3',value:'m'}],ai:()=>gearCount(p)<8?'g':'f'});
      if(ch==='f') gain(p,5000,'VIRAL MOMENT'); else if(ch==='g') await missingGear(p,'VIRAL MOMENT'); else moveForward(p,3,'VIRAL MOMENT'); break;}
    case 'GAIN_SPONSORSHIP':{
      const o={why:c.title,fallback:fb(c.fallback)};
      if(c.sec==='REQUIRES_LEVEL') o.minLevel=c.secv; if(c.sec==='REQUIRES_EQUIPMENT_COUNT') o.reqGear=c.secv;
      if(c.sec==='GAIN_FOLLOWERS') o.bonus=c.secv; if(c.sec==='ADD_STREAM_STRENGTH') o.ssBonus=c.secv;
      sponsorship(p,o); break;}
    case 'LOSE_SPONSORSHIP':
      if(p.sp>0){ if(!(await blocked(p,'sponsor','Sponsor pulls out'))){p.sp--; log(`<b>${esc(p.name)}</b> loses a sponsorship.`,'bad');} }
      else await lose(p,c.secv||1000,c.title); break;
    case 'RIVAL_STEAL':{ const q=await pickRival(p,c.title,'Steal 10% of their followers.',o=>o.f>0,'leader'); if(!q){gain(p,500,c.title+' (no target)');break;}
      const amt=Math.floor(q.f*0.10); if(await blocked(q,'followers',`${p.name} snipes ${fmt(amt)} followers`)) break; q.f-=amt; p.f+=amt; q.hits=(q.hits||0)+1; ev('riv'); log(`<b>${esc(p.name)}</b> STREAM SNIPES <b>${esc(q.name)}</b> for ${fmt(amt)} followers!`,'bad'); break;}
    case 'RIVAL_MISS_TURN':{ const q=await pickRival(p,c.title,'They miss their next turn.',null,'leader'); if(!q){gain(p,500,c.title+' (no target)');break;} ev('riv'); log(`<b>${esc(p.name)}</b> drops a ${esc(c.title)} on <b>${esc(q.name)}</b>.`); await missTurn(q,c.title); break;}

      if(!q){gain(p,500,c.title+' (nobody has a sponsor yet)');break;} ev('riv');
      if(await blocked(q,'sponsor',`${p.name} tries to poach a sponsor`)) break;
      const a=await rollDie(), b=await rollDie(); log(`Brand Poach: <b>${esc(p.name)}</b> ${a} vs <b>${esc(q.name)}</b> ${b}.`);
      if(a>b){q.sp--; p.sp++; q.hits=(q.hits||0)+1; log(`<b>${esc(p.name)}</b> POACHES a sponsor from <b>${esc(q.name)}</b>!`,'bad');} else log(`<b>${esc(q.name)}</b>'s sponsor stays loyal.`); break;}
    case 'RIVAL_COLLAB':{ const q=await pickRival(p,c.title,'You gain 1,000 and they gain 500 (each at your own level).',null,'trailer'); if(!q){gain(p,1000,c.title);break;} ev('riv'); gain(p,1000,c.title); gain(q,500,'collab with '+p.name); break;}
    case 'RIVAL_CALLOUT':{ const q=await pickRival(p,c.title,'Both roll. Winner +1,000 followers, loser −500 (each at their own level). Ties: nothing.',null,'leader'); if(!q){gain(p,500,c.title+' (no target)');break;} ev('riv');
      const a=await rollDie(), b=await rollDie(); log(`Callout: <b>${esc(p.name)}</b> ${a} vs <b>${esc(q.name)}</b> ${b}.`);

    case 'RIVAL_TROLL':{ const q=await pickRival(p,c.title,'Send a Troll Raid at them.',null,'leader'); if(!q){gain(p,500,c.title+' (no target)');break;} ev('riv'); log(`<b>${esc(p.name)}</b> sends a Hate Raid at <b>${esc(q.name)}</b>!`,'bad'); await trollRaid(q); break;}
    case 'RIVAL_SHOUTOUT':{ const q=await pickRival(p,c.title,'You and they both gain 2 Stream Strength.',null,'trailer'); p.ss+=2; log(`<b>${esc(p.name)}</b> +2 Stream Strength — ${esc(c.title)}.`); if(q){q.ss+=2; log(`<b>${esc(q.name)}</b> +2 Stream Strength — shoutout from ${esc(p.name)}.`);} break;}
    case 'RIVAL_COPYCAT':{ const opts=[...new Set(S.players.filter(o=>o!==p).flatMap(o=>SLOTS.filter(s=>o.gear[s]>0&&!p.gear[s])))];
      if(!opts.length){gain(p,500,c.title+' (nothing to copy)');break;} ev('riv');
      const slot=opts.length===1?opts[0]:await ask(p,{title:`${c.title}: copy a setup`,text:'Take a BS piece of any gear another player has and you don\'t.',buttons:opts.map(s=>({label:SLOT_NAME[s],value:s})),ai:()=>opts[rand(opts.length)]});
      await gearGain(p,slot,1,c.title); break;}
    default: log(`(Card effect ${esc(c.code)} not handled.)`);
  }
  await cardDone(p);
}
async function challenge(p,{purpose='normal',times=1}={}){
  const c=draw('C'); const pq=c.prompts&&c.prompts.length?rand(c.prompts.length):null;
  showCard('challenge',c,pq,times>1?'DOUBLE REWARDS':purpose==='shortcut'?'SHORTCUT CHALLENGE':purpose==='checkpoint'?'CHECKPOINT CHALLENGE':''); log(`<b>${esc(p.name)}</b> draws Challenge: <b>${esc(c.title)}</b>.`);
  const pr=pq!=null?(c.prompts[pq].style?`Read the ${c.prompts[pq].brand} ad in the script box — style: ${c.prompts[pq].style}`:c.prompts[pq].q):'';
  let ok;
  const opts={title:S.settings.hostPresent||p.ai?`Challenge: ${c.title}`:`${p.name}, did you nail ${c.title}?`,text:`${pr?pr+' · ':''}${S.settings.hostPresent?'Host judges.':'Your call — be honest.'} ${c.timer}s on the clock.`,timer:c.timer,
    buttons:[{label:'Nailed it',value:true,kind:'good'},{label:'Missed it',value:false,kind:'bad'}],ai:()=>Math.random()<S.settings.aiChallenge};
  if(p.ai) ok=await ask(p,opts);
  else if(S.settings.hostPresent) ok=await ask(null,{...opts,title:`Host: did ${p.name} pass ${c.title}?`});
  else ok=await ask(p,opts);
  if(ok) p.cw=(p.cw||0)+1;
  log(`<b>${esc(p.name)}</b> ${ok?'passes':'fails'} ${esc(c.title)}${ok&&times>1?' — DOUBLE rewards':''}.`);
  if(purpose!=='normal'){ await cardDone(p,ok); return ok; }
  if(ok) for(let t=0;t<times;t++){
    switch(c.sc){
      case 'GAIN_FOLLOWERS': gain(p,c.sv,c.title); break;
      case 'GAIN_FOLLOWERS_COLLAB':{const others=S.players.filter(q=>q!==p); if(!others.length){gain(p,c.sv,c.title);break;}
        const pid=await ask(p,{title:'Pick your collab partner',text:'You both gain followers.',buttons:others.map(q=>({label:q.name,value:q.id})),ai:()=>others[rand(others.length)].id});
        const q=S.players.find(x=>x.id===pid); gain(p,c.sv,c.title); const a=Math.round(c.sv*mult(q)); q.f+=a; log(`<b>${esc(q.name)}</b> +${fmt(a)} followers — collab.`); break;}
      case 'GAIN_RANDOM_EQUIPMENT': await randomGear(p,c.title); break;
      case 'GAIN_ANY_MISSING_EQUIPMENT': await missingGear(p,c.title); break;
      case 'GAIN_SPONSORSHIP':{const m=/\+\s*(\d+) Followers/.exec(c.success.split('(')[0]); sponsorship(p,{why:c.title,fallback:fb(c.fallback),bonus:m?+m[1]:0}); break;}
    }
  } else {
    if(c.fc==='LOSE_FOLLOWERS') await lose(p,c.fv,c.title); else if(c.fc==='MISS_TURN') await missTurn(p,c.title);
  }
  await cardDone(p,ok);
  return ok;
}
async function cancelTable(p){
  if(await blocked(p,'cancel','Draw from the Cancellation table')) return;
  p.hits=(p.hits||0)+1; const e=DATA.cancel[rand(DATA.cancel.length)]; showCard('cancel',e); log(`<b>${esc(p.name)}</b> is CANCELLED: <b>${esc(e.title)}</b>.`,'bad'); await sleep(400);
  if(e.code==='LOSE_FOLLOWERS'){p.lastCancelLoss=await lose(p,e.value,e.title,true);}
  else if(e.code==='MISS_TURN') await missTurn(p,e.title,true);
  else if(e.code==='MOVE_BACKWARD') await moveBack(p,e.value,e.title,true);
  else if(e.target==='IGNORE_LAST_CANCELLATION'){ if(p.lastCancelLoss){p.f+=p.lastCancelLoss; log(`<b>${esc(p.name)}</b> gets back ${fmt(p.lastCancelLoss)} followers from the last Cancellation.`); p.lastCancelLoss=0;} else log('Nothing to undo.'); }
  else log(`<b>${esc(p.name)}</b>'s community has their back — no penalty.`);
  await cardDone(p);
}

async function trollRaid(p){

// Choose another player for a Rivalry card. AI: 'leader' = most followers, 'trailer' = fewest, 'sponsors' = most sponsorships.
async function pickRival(p,title,text,filter,pref){
  const opts=S.players.filter(o=>o!==p&&(!filter||filter(o))); if(!opts.length) return null;
  const pickAI=()=>{ const by=pref==='trailer'?(a,b)=>a.f-b.f:pref==='sponsors'?(a,b)=>b.sp-a.sp||b.f-a.f:(a,b)=>b.f-a.f; return [...opts].sort(by)[0].id; };
  const id=opts.length===1?opts[0].id:await ask(p,{title:`${title}: pick a player`,text,buttons:opts.map(o=>({label:`${o.name} (${fmt(o.f)})`,value:o.id})),ai:pickAI});
  return S.players.find(o=>o.id===id);
}
// Landing on a space another player is on (by roll): Collab (both +500 × own level) or Clout Chase (roll-off, winner takes 10% of the loser's followers).
async function showdown(p){
  if(S.players.length>6) return; // Showdowns are off in games with 7+ players (keeps big games moving).
  const here=S.players.filter(o=>o!==p&&o.pos===p.pos); if(!here.length) return;
  // Optional. Collab with anyone; Clout Chase only someone with MORE followers than you (punch up).
  const btns=[{label:'Collab',value:'collab',kind:'good'}];
  const up=here.filter(o=>o.f>p.f);
  if(up.length) btns.push({label:'Clout Chase',value:'chase',kind:'primary'});
  btns.push({label:'Keep moving',value:'skip'});
  const names=here.map(o=>o.name).join(', ');
  const ch=await ask(p,{title:`Showdown at space ${p.pos}`,text:`${names} ${here.length>1?'are':'is'} here. Collab: you both gain 500 followers (× your own level). ${up.length?'Clout Chase: roll-off against someone with more followers than you — winner takes 10% of the loser\'s followers. ':''}Or keep moving.`,
    buttons:btns,ai:()=>up.length&&Math.random()<.7?'chase':Math.random()<.3?'collab':'skip'});
  if(ch==='skip') return;
  const pool=ch==='chase'?up:here;
  let q=pool[0];
  if(pool.length>1){ const qid=await ask(p,{title:ch==='chase'?'Clout Chase: who?':'Collab with who?',buttons:pool.map(o=>({label:`${o.name} (${fmt(o.f)})`,value:o.id})),ai:()=>[...pool].sort((a,b)=>b.f-a.f)[0].id}); q=S.players.find(o=>o.id===qid); }
  ev(ch);
  if(ch==='collab'){ log(`<b>${esc(p.name)}</b> and <b>${esc(q.name)}</b> collab!`); gain(p,500,'collab'); gain(q,500,'collab'); return; }
  const a=await rollDie(), b=await rollDie(); log(`Clout Chase: <b>${esc(p.name)}</b> ${a} vs <b>${esc(q.name)}</b> ${b}.`);
  if(a===b){ log('Dead heat — nobody gains.'); return; }
  const w=a>b?p:q, l=w===p?q:p; const amt=Math.floor(l.f*0.10);
  if(amt<=0){ log(`<b>${esc(l.name)}</b> has no followers to take.`); return; }
  if(await blocked(l,'followers',`${w.name} takes ${fmt(amt)} followers in a Clout Chase`)) return;
  l.f-=amt; w.f+=amt; l.hits=(l.hits||0)+1; log(`<b>${esc(w.name)}</b> wins the Clout Chase and takes ${fmt(amt)} followers from <b>${esc(l.name)}</b>!`,'good');
}

// Shortcut travel: the token slides along the route (VIP Bridge: across A1–A5) instead of teleporting.
const VIP_PTS=[[1810,1255],[1865,1255],[1920,1255],[1975,1255],[2030,1255]];
async function slideShortcut(p,sc){
  const a=space(p.pos), b=space(sc.to);
  const pts=sc.name==='VIP Bridge'?VIP_PTS:[1,2,3,4].map(k=>[a.x+(b.x-a.x)*k/5,a.y+(b.y-a.y)*k/5]);
  if(fxOn()) for(const [x,y] of pts){ p.at={x,y}; renderTokens(); await sleep(190); }
  delete p.at; p.pos=sc.to; renderTokens(); renderSpace(p.pos); pushState();
}

// ---------- spaces ----------
async function resolveSpace(p){
  const b=space(p.pos);
  switch(b.type){
    case 'F+': gain(p,b.value,b.name); break;
    case 'F-': await lose(p,b.value,b.name); break;
    case 'VIRAL': await resolveViral(p); break;
    case 'CHAL': await challenge(p); break;
    case 'EQUIP': await randomGear(p,b.name); break;
    case 'CANCEL': await cancelTable(p); break;
    case 'RISK':{
      const ch=await ask(p,{title:'Risk It',text:'Safe: +250 followers. Risk: roll 1–2 −1,000 · 3–4 +500 · 5 +2,000 · 6 random gear.',buttons:[{label:'Play it safe',value:'safe'},{label:'Risk it',value:'risk',kind:'primary'}],ai:()=>Math.random()<.5?'risk':'safe'});
      if(ch==='safe') gain(p,250,'played it safe'); else {const d=await rollDie(); if(d<=2) await lose(p,1000,'Risk It roll '+d); else if(d<=4) gain(p,500,'Risk It roll '+d); else if(d===5) gain(p,2000,'Risk It roll 5'); else await randomGear(p,'Risk It roll 6');}
      break;}
    case 'TROLL': await trollRaid(p); break;
    case 'SPONSOR': await sponsorMeeting(p,b.name); break;
    case 'STAGE': if(!p.staged) await centerCourt(p); else { log(`<b>${esc(p.name)}</b> is back at Center Court — the crowd remembers. Draw a Viral card.`); await resolveViral(p); } break;
    case 'AWARDS': if(S.awardsBy===p.id&&S.awardsRound===S.round) log(`<b>${esc(p.name)}</b> takes a bow at the Award Theater.`); else { log(`<b>${esc(p.name)}</b> is a late nominee at the Award Theater — Challenge with DOUBLE rewards!`,'good'); await challenge(p,{times:2}); } break;
    case 'ARENA': await liveArena(p); break;
    case 'CARPET': await redCarpet(p); break;
    default: break;
  }
  const sc=SHORTCUTS[p.pos];
  if(sc && space(p.pos)===b){
    if(sc.needSponsor && p.sp<1){log(`<b>${esc(p.name)}</b> can't use the ${sc.name} without a sponsorship.`);}
    else{
      const ch=await ask(p,{title:`Shortcut: ${sc.name}`,text:`Draw a Challenge. Win and jump to space ${sc.to}. Lose and stay here.`,buttons:[{label:'Try it',value:'y',kind:'primary'},{label:'No thanks',value:'n'}],ai:()=>'y'});
      if(ch==='y'){ const ok=await challenge(p,{purpose:'shortcut'}); if(ok){ log(`<b>${esc(p.name)}</b> takes the ${sc.name} to ${sc.to}!`,'good'); await slideShortcut(p,sc); } }
    }
  }
}
async function sponsorMeeting(p,why){

  if(d+bonus>=4){p.sp++; if(why==='The Pitch') ev('pitchSp'); log(`<b>${esc(p.name)}</b> rolls ${d}${bonus?'+'+bonus:''} and signs a sponsorship at ${esc(why)}! (${p.sp} total)`,'good');}

}

// Center Court LIVE (62): everyone stops once. Perform a Challenge prompt; the other players vote. Win = +1,000 × level and Crowd Favorite.
async function centerCourt(p){
  p.staged=true; ev('stage');
  log(`<b>${esc(p.name)}</b> takes the CENTER COURT stage — LIVE!`,'good');
  const c=draw('C'); const pq=c.prompts&&c.prompts.length?rand(c.prompts.length):null; showCard('challenge',c,pq,'CENTER COURT LIVE');
  const pr=pq!=null?c.prompts[pq].q:c.flavor;
  const voters=S.players.filter(q=>q!==p); const n=voters.length;
  const aiGood=Math.random()<S.settings.aiChallenge;

  let yes=0, tot=n;
  if(!n){ tot=1; yes=(await ask(null,{title:`Did ${p.name} own the stage?`,buttons:[{label:'Yes',value:1,kind:'good'},{label:'No',value:0,kind:'bad'}],ai:()=>aiGood?1:0}))?1:0; }
  else {
    for(const q of voters) if(q.ai && Math.random()<(p.ai?(aiGood?.85:.25):.6)) yes++;
    for(const q of voters.filter(q=>q.remote&&!q.ai)) if(await ask(q,{title:`Vote: did ${p.name} own the stage?`,text:'Your vote counts toward Crowd Favorite.',buttons:[{label:'Yes!',value:true,kind:'good'},{label:'Nah',value:false,kind:'bad'}]})) yes++;
    const loc=voters.filter(q=>!q.ai&&!q.remote);
    if(loc.length) yes+=await ask(null,{title:'Crowd vote — hands up!',text:`${loc.map(q=>q.name).join(', ')}: raise a hand if ${p.name} owned the stage. How many hands are up?`,buttons:[...Array(loc.length+1)].map((_,i)=>({label:String(i),value:i}))});
  }
  log(`Crowd vote for <b>${esc(p.name)}</b>: ${yes} of ${tot} yes.`);
  if(yes*2>=tot){ gain(p,1000,'Center Court LIVE'); p.crowd=true; ev('crowd'); log(`<b>${esc(p.name)}</b> is a CROWD FAVORITE: +1 on every Sponsor Meeting roll for the rest of the game.`,'good'); }
  else log(`Tough crowd for <b>${esc(p.name)}</b> — no harm done.`);
  await cardDone(p,yes*2>=tot);
}
// Creator Awards (108): runs once, for the whole table, the first time anyone reaches or passes 108. One award per player.
async function creatorAwards(trig){
  S.awardsDone=true; S.awardsBy=trig.id; S.awardsRound=S.round; ev('awards');
  log(`THE CREATOR AWARDS! <b>${esc(trig.name)}</b> reached the Award Theater — the whole table is invited.`,'good');
  const won=new Set(); const fewer=(a,b)=>a.f<=b.f?a:b;
  if(S.players.length>1){
    const votes={};
    for(const q of S.players){ const others=S.players.filter(o=>o!==q);
      const v=await ask(q,{title:`Creator Awards — ${q.name}, vote for Audience Favorite`,text:'Anyone but yourself.',buttons:others.map(o=>({label:o.name,value:o.id})),ai:()=>others[rand(others.length)].id});
      votes[v]=(votes[v]||0)+1; }
    let fav=null; for(const q of S.players){ const v=votes[q.id]||0; if(!v) continue; if(!fav||v>(votes[fav.id]||0)||(v===(votes[fav.id]||0)&&q.f<fav.f)) fav=q; }
    if(fav){ log(`Audience Favorite goes to <b>${esc(fav.name)}</b> (${votes[fav.id]} vote${votes[fav.id]>1?'s':''}).`,'good'); won.add(fav); await awardPrize(fav,AWARDS[0]); }
  }

    const best=cand.reduce((a,b)=>cat.score(b)>cat.score(a)?b:cat.score(b)<cat.score(a)?a:fewer(a,b));
    log(`${cat.n} goes to <b>${esc(best.name)}</b>.`,'good'); won.add(best); await awardPrize(best,cat);
  }

async function awardPrize(p,cat){

// ---------- checkpoints & mansion ----------
function qualifies(p,cp){const c=CHECKPOINTS[cp]; return p.f>=c.followers && gearCount(p)>=c.gear;}
async function clearCP(p,cp){p.cleared.push(cp); p.ss=Math.max(p.ss,gearTotal(p)); log(`<b>${esc(p.name)}</b> clears ${cp===80?'':'the '}${CHECKPOINTS[cp].name}! Stream Strength refilled to ${p.ss}.`,'good');}
async function checkpointAttempt(p,cp){
  const c=CHECKPOINTS[cp]; const need=[]; if(gearCount(p)<c.gear) need.push(`${c.gear-gearCount(p)} more gear`); if(p.f<c.followers) need.push(`${fmt(c.followers-p.f)} more followers`);
  const btns=[{label:'PLAY',value:'play',kind:'primary'}]; if(S.settings.allowPay) btns.push({label:'PAY (host deal)',value:'pay'});
  const ch=await ask(p,{title:c.name,text:`Needs ${need.join(' and ')}. Win PLAY${S.settings.allowPay?' or get the host to confirm PAY':''} to get what's missing.`,buttons:btns,ai:()=>'play'});
  let ok=false;
  if(ch==='pay'){ ok=await ask(null,{title:`Host: confirm deal for ${p.name}?`,text:'Whatever the deal is, it happens outside the game. Confirm only if it was completed.',buttons:[{label:'Confirm',value:true,kind:'good'},{label:'Decline',value:false,kind:'bad'}]}); log(`Host ${ok?'confirms':'declines'} PAY for <b>${esc(p.name)}</b>.`,'host'); }
  else if(S.settings.hostPresent && !p.ai){ ok=await ask(null,{title:`PLAY: ${p.name} vs the host`,text:'Play Square Biz! (or any quick game). Who won?',buttons:[{label:`${p.name} won`,value:true,kind:'good'},{label:'Host won',value:false,kind:'bad'}]}); log(`<b>${esc(p.name)}</b> ${ok?'wins':'loses'} PLAY against the host.`); }
  else ok=await challenge(p,{purpose:'checkpoint'});
  if(ok){ if(gearCount(p)<c.gear) await missingGear(p,c.name); else gain(p,500,c.name+' reward'); }
  if(qualifies(p,cp)) await clearCP(p,cp); else log(`<b>${esc(p.name)}</b> stays at the ${c.name}.`);
}
function hasWon(p){return p.pos===120 && p.sp>=1 && gearCount(p)>=8 && p.f>=1e6;}
function declareWin(p){S.winner=p.id; log(`<b>${esc(p.name)}</b> GOES VIRAL and wins the game!`,'good'); renderWin(); saveGame(); pushState();}
// Mansion gates: reach 120 (by roll or card) with everything = win; otherwise you're turned away to space 100.
async function mansionGates(p){
  if(p.arrF==null){p.arrF=p.f;p.arrSp=p.sp;p.arrR=S.round;}
  log(`<b>${esc(p.name)}</b> reaches the Streamer Mansion gates!`);
  await sleep(1400);
  if(hasWon(p)){declareWin(p);return;}
  const miss=[]; if(p.sp<1) miss.push('a sponsorship'); if(gearCount(p)<8) miss.push(`${8-gearCount(p)} more gear`); if(p.f<1e6) miss.push(`${fmt(1e6-p.f)} more followers`);
  p.bounces=(p.bounces||0)+1; p.pos=100; renderTokens();
  log(`TURNED AWAY at the gates — <b>${esc(p.name)}</b> still needs ${miss.join(', ')}. Back to space 100.`,'bad');
}

// ---------- turn flow ----------
async function takeTurn(){
  const p=curP(); if(S.card){S.card=null;} renderAll();
  if(p.skip>0){p.skip--; log(`<b>${esc(p.name)}</b> misses this turn.`); await sleep(400); return;}
  if(p.pos===120){await mansionGates(p); return;}
  if(CHECKPOINTS[p.pos] && !p.cleared.includes(p.pos)){await checkpointAttempt(p,p.pos); return;}
  if(p.pos===62 && !p.staged) await centerCourt(p);
  await ask(p,{title:`${p.name}, roll the dice`,text:`You're on ${p.pos} · ${space(p.pos).name}.`,buttons:[{label:'Roll the Berna Dice',value:'roll',kind:'primary'}]});
  const d=await rollDie();
  const to=capMove(p,Math.min(120,p.pos+d));
  log(`<b>${esc(p.name)}</b> rolls ${d} → ${to}${to===62&&p.pos+d>62?' (everyone stops at Center Court)':''}.`);
  while(p.pos<to){p.pos++; renderTokens(); await sleep(150);}
  pushState();
  const b=space(p.pos); renderSpace(p.pos);
  if(b.type==='CHECKPOINT'){ if(qualifies(p,p.pos)) await clearCP(p,p.pos); else await checkpointAttempt(p,p.pos); return; }
  if(b.type==='MANSION'){ await mansionGates(p); return; }
  if(!['START','STAGE'].includes(b.type)){ const at=p.pos; await showdown(p); if(p.pos!==at) return; }
  if(!S.awardsDone && p.pos>=108){ const at=p.pos; await creatorAwards(p); if(p.pos!==at) return; }
  await resolveSpace(p);
  if(!S.awardsDone && p.pos>=108) await creatorAwards(p);
  if(p.pos===120 && !S.winner) await mansionGates(p); // a card or prize moved you to 120
}
async function loop(){
  const id=++loopId;
  while(S&&S.started&&!S.winner&&id===loopId){
    saveGame(); await takeTurn(); if(id!==loopId) return;
    renderAll(); await sleep(SPEED[S.settings.speed]/2);
    if(S.winner) break;
    S.cur=(S.cur+1)%S.players.length; if(S.cur===0) S.round++;
  }
  renderAll(); pushState();
}

async function getRoom(){ try{ return window.claude&&window.claude.use?await window.claude.use('room'):null; }catch(e){ return null; } }
async function getUser(){ try{ return window.claude&&window.claude.use?await window.claude.use('user'):null; }catch(e){ return null; } }

let pushT=null;
function pushState(){ if(MODE!=='host'||!RNAME) return; if(pushT) return; pushT=setTimeout(()=>{pushT=null; sendState();},150); }
function packState(nLog){
  const pr=S.prompt;
  return {v:2,rd:S.round,cur:S.cur,lr:S.lastRoll||5,w:S.winner||null,st:{m:S.settings.mult,hp:S.settings.hostPresent?1:0,pay:S.settings.allowPay?1:0},

    pl:S.players.map(p=>[p.pos,p.f,p.sp,p.ss,p.skip,p.shield?1:0,SLOTS.map(s=>p.gear[s]||0).join(''),p.cleared.join('.'),(p.crowd?'C':'')+(p.staged?'S':''),p.award||'']),

    pr:pr?{id:pr.pid,s:pr.seat,w:pr.who,t:String(pr.title).slice(0,90),x:String(pr.text||'').slice(0,240),b:pr.buttons.map(b=>[String(b.label).slice(0,30),b.kind||'']),tm:pr.timer||0}:null,

function sendState(){
  if(!RNAME) return; let n=6, data=packState(n);
  while(new TextEncoder().encode(JSON.stringify(data)).length>3900 && n>0){n--; data=packState(n);}
  RNAME.emit('state',data).catch(()=>{});
}
async function hostRoom(code){
  const room=await getRoom(); if(!room) return false;
  try{ RNAME=await room.join('viral-'+code.toLowerCase()); }catch(e){ return false; }
  ROOMCODE=code; $('roomTag').hidden=false; $('roomTag').textContent='ROOM '+code;
  RNAME.presence({role:'host'}).catch(()=>{});
  unsubs.push(RNAME.on('act',msg=>{
    const d=msg.data||{}; const pr=S&&S.prompt; if(!pr||!resolver) return;
    if(d.pid!==pr.pid||d.seat!==pr.seat) return;
    const seatP=S.players.find(p=>p.id===d.seat); if(!seatP||!seatP.remote) return;
    const i=+d.i; if(!(i>=0&&i<pr.buttons.length)) return;
    resolver(pr.buttons[i].value);
  }));
  unsubs.push(RNAME.onPeers(ch=>{ if(ch.joined.length) sendState(); renderPlayers(); }));
  hb=setInterval(sendState,4000);
  return true;
}
function connectedSeats(){ if(!RNAME) return {}; const m={}; RNAME.peers().forEach(p=>{const s=p.presence&&p.presence.seat; if(typeof s==='string') m[s]=true;}); return m; }
async function joinRoom(code){
  const room=await getRoom(); if(!room) return 'This view can’t connect to online rooms.';
  try{ RNAME=await room.join('viral-'+code.toLowerCase()); }catch(e){ return 'Couldn’t reach the room server. Check your connection and try again.'; }
  ROOMCODE=code; MODE='client'; loopId++; resolver=null;
  $('roomTag').hidden=false; $('roomTag').textContent='ROOM '+code;
  unsubs.push(RNAME.on('state',msg=>{ if(msg.sameTab) return; netState=msg.data; applyNet(); }));
  return null;
}
function applyNet(){
  const n=netState; if(!n||!n.ro) return;
  const prevLog=S&&S.log?S.log:[];
  S={started:true,settings:{...DEFAULTS,mult:n.st.m,hostPresent:!!n.st.hp,allowPay:!!n.st.pay},round:n.rd,cur:n.cur,lastRoll:n.lr,winner:n.w,
     players:n.ro.map((r,i)=>{const q=n.pl[i]; const gear={}; SLOTS.forEach((s,k)=>gear[s]=+q[6][k]); return {id:r[0],name:r[1],token:r[2],ai:!!r[3],remote:!!r[4],pos:q[0],f:q[1],sp:q[2],ss:q[3],skip:q[4],shield:!!q[5],gear,cleared:q[7]?String(q[7]).split('.').map(Number):[],crowd:/C/.test(q[8]||''),staged:/S/.test(q[8]||''),award:q[9]||null};}),
     card:n.cd?{kind:n.cd[0],id:n.cd[1],pq:n.cd[2],rev:!!n.cd[3],ok:n.cd[4]==null||n.cd[4]<0?null:!!n.cd[4],res:n.cd[5]||'',ev:n.cd[6]||''}:null,
     prompt:n.pr?{pid:n.pr.id,seat:n.pr.s,who:n.pr.w,title:n.pr.t,text:n.pr.x,buttons:n.pr.b.map(b=>({label:b[0],kind:b[1]})),timer:n.pr.tm}:null,
     log:n.lg.map(l=>({r:l[0],m:esc(l[1]),c:l[2]}))};
  if(!mySeat) { renderSeatPick(); }
  renderAll(); if(S.winner) renderWin();
  if(prevLog.length){ const top=prevLog[0]&&prevLog[0].m; const fresh=[]; for(const l of S.log){ if(l.m===top) break; fresh.push(l); } if(fresh.length<6) fresh.reverse().forEach(l=>{try{fxFor(l.m,true);}catch(e){}}); }
}

      let x=b.x+Math.cos(ang)*rad, y=b.y+Math.sin(ang)*rad*.6; if(p.at){x=p.at.x; y=p.at.y;}
      h.push([p,x,y]);});}

  for(const [p,x,y0] of h){ const y=y0; let g=root.querySelector(`[data-pid="${p.id}"]`);

  // ---- camera ----

  function overview(){ userOrbit=false; userZoom=1; }

  // ---- input: drag to orbit, pinch/wheel to zoom, tap a space for info ----
  function wire(){ const pts=new Map(); let start=null, moved=0, pinch0=0, zoom0=1;
    cv.style.touchAction='none';
    cv.addEventListener('pointerdown',e=>{ dragging=true; cv.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]); moved=0; start=[e.clientX,e.clientY,goal.th,goal.ph,e.button===2||e.shiftKey];

  function tap(e){ const r=cv.getBoundingClientRect(); const nx=(e.clientX-r.left)/r.width*2-1, ny=1-(e.clientY-r.top)/r.height*2-clamp(inset/r.height,0,.6);

  // ---- frame ----

    if(W!==lastW||H!==lastH||cv.width!==Math.round(W*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); lastW=W; lastH=H; City.recam(); } return true; }

  function useM(m){ gl.useProgram(progM.p); bind(m); }

  if(k&&k.kind==='challenge'){ const c=cardById('challenge',k.id), q=k.pq!=null&&c.prompts?c.prompts[k.pq]:null;
    h+=`<div class="pt">${esc(c.title)}</div>${q?`<div class="peek">${esc(q.q)}${q.a?`<div style="margin-top:6px;color:var(--good)">${rPeek?'Answer: '+esc(q.a):''}</div>`:''}</div>`:''}${q&&q.a?`<button type="button" id="rPeekBtn">${rPeek?'Hide answer':'Peek at the answer'}</button>`:''}`; }
  if(pr){ const seatP=S.players.find(x=>x.id===pr.seat), ai=seatP&&seatP.ai;
    h+=`<div class="pt">${esc(pr.title)}</div>${pr.text?`<div class="px">${esc(pr.text)}</div>`:''}${pr.timer?timerHTML(pr.timer):''}
      <div class="bigbtns">${pr.buttons.map((b,i)=>`<button type="button" class="${b.kind||''}" data-ri="${i}" ${ai?'disabled':''}>${esc(b.label)}</button>`).join('')}</div>${ai?'<div class="info">AI is deciding…</div>':seatP&&seatP.id!==S.players[S.cur].id?`<div class="info">Answering for ${esc(seatP.name)}.</div>`:''}`; }
  else h+='<div class="info">Nothing to decide right now.</div>';
  box.innerHTML=h;
  box.querySelectorAll('[data-ri]').forEach(b=>b.onclick=()=>{ if(resolver&&S.prompt) resolver(S.prompt.buttons[+b.dataset.ri].value); });
  box.querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>startTimer(+b.dataset.t)); paintTimer();
  const pk=$('rPeekBtn'); if(pk) pk.onclick=()=>{ rPeek=!rPeek; renderRemoteNow(); }; }
function renderRemote(){ const el=$('remote'); if(!el||el.hidden) return; if(!S||!S.started||MODE==='client'){ closeRemote(); return; }
  const sc=el.scrollTop; const sel=S.players.find(p=>p.id===rSel);
  const amts=[500,1000,5000,10000,50000];
  el.innerHTML=`<div class="rhead"><h2>HOST REMOTE</h2>${rUndo?`<button type="button" class="undo" id="rUndo" title="Undo: ${esc(rUndo.msg)}">Undo</button>`:''}<button type="button" id="rClose">Close</button></div>
    <section><h3>Right now</h3><div class="now" id="rNow"></div></section>
    <section><h3>Players — tap one to adjust</h3><div class="tiles">${S.players.map((p,i)=>`<button type="button" class="tile${p.id===rSel?' sel':''}" data-p="${p.id}">${VP.token(p.token,40)}<span><span class="tn">${esc(p.name)}${p.ai?' <span class="chip">AI</span>':''}${i===S.cur?' <span class="chip ok">NOW</span>':''}</span><br><span class="ts">Space ${p.pos} · ${gearCount(p)}/8 gear · SS ${p.ss} · ${p.sp} sponsor${p.sp===1?'':'s'}${p.skip?` · skips ${p.skip}`:''}</span></span><span class="tf">${fmt(p.f)}</span></button>
      ${p.id===rSel?`<div class="acts">
        <div class="arow"><span class="al">FOLLOWERS</span><div class="seg" style="width:100%">${amts.map(a=>`<button type="button" data-amt="${a}" aria-pressed="${rAmt===a}">${fmt(a)}</button>`).join('')}</div>
          <button type="button" class="bad" data-a="fsub">− ${fmt(rAmt)}</button><button type="button" class="good" data-a="fadd">+ ${fmt(rAmt)}</button></div>
        <div class="arow"><span class="al">GEAR · SPONSORS · STREAM STRENGTH</span><button type="button" data-a="gear" ${gearCount(p)>=8?'disabled':''}>+ Missing gear</button><button type="button" data-a="spadd">+1 Sponsor</button><button type="button" data-a="spsub" ${p.sp?'':'disabled'}>−1 Sponsor</button><button type="button" data-a="ssadd">+3 SS</button><button type="button" data-a="sssub" ${p.ss?'':'disabled'}>−3 SS</button></div>
        <div class="arow"><span class="al">MOVE</span><button type="button" data-a="back">◀ Back 1</button><button type="button" data-a="fwd">Forward 1 ▶</button><input type="number" id="rPos" min="1" max="120" value="${p.pos}" aria-label="Space number"><button type="button" data-a="goto">Go</button></div>
        <div class="arow"><span class="al">TURNS & CONTROL</span><button type="button" data-a="skip">Skip next turn</button>${p.skip?'<button type="button" data-a="unskip">Cancel skip</button>':''}
          <div class="seg" style="width:100%">${[['h','This screen'],['r','Online device'],['a','AI']].map(([v,l])=>`<button type="button" data-ctrl="${v}" aria-pressed="${(p.ai?'a':p.remote?'r':'h')===v}">${l}</button>`).join('')}</div></div>
      </div>`:''}`).join('')}</div></section>
    <section><h3>Game settings</h3>
      <label class="tog">Host judges challenges <input type="checkbox" id="rHost" ${S.settings.hostPresent?'checked':''}></label>
      <label class="tog">Allow PAY at checkpoints (host deal) <input type="checkbox" id="rPay" ${S.settings.allowPay?'checked':''}></label>
      <label class="tog">Heads-up tips <input type="checkbox" id="rTips" ${tipsOn?'checked':''}></label>
      <label class="tog">Sound <input type="checkbox" id="rSound" ${SFX.on?'checked':''}></label>
      <div class="arow"><span class="al">AI SPEED</span><div class="seg">${['normal','fast','instant'].map(v=>`<button type="button" data-speed="${v}" aria-pressed="${S.settings.speed===v}">${v}</button>`).join('')}</div></div>
      <div class="info" style="margin-top:8px">Every change is written to the turn log.</div></section>`;
  el.scrollTop=sc; renderRemoteNow();
  $('rClose').onclick=closeRemote;
  const u=$('rUndo'); if(u) u.onclick=()=>{ const p=S.players.find(x=>x.id===rUndo.id); if(p){ const was=rUndo.msg; Object.assign(p,JSON.parse(rUndo.snap)); rUndo=null; log('HOST: undo — '+was,'host'); renderAll(); saveGame(); pushState(); } };
  el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ rSel=rSel===b.dataset.p?null:b.dataset.p; renderRemote(); });
  el.querySelectorAll('[data-amt]').forEach(b=>b.onclick=()=>{ rAmt=+b.dataset.amt; renderRemote(); });
  if(sel){ const p=sel, N=esc(p.name);
    const A={ fadd:()=>hostDo(p,`+${fmt(rAmt)} followers to ${N}`,()=>{p.f+=rAmt;}), fsub:()=>hostDo(p,`−${fmt(rAmt)} followers from ${N}`,()=>{p.f=Math.max(0,p.f-rAmt);}),
      gear:async()=>{ const m=SLOTS.filter(x=>!p.gear[x]); if(!m.length) return; rUndo={id:p.id,snap:JSON.stringify(p),msg:`gave ${N} a ${SLOT_NAME[m[0]]}`}; await gearGain(p,m[0],1,'host'); log(`HOST: gave ${N} a ${SLOT_NAME[m[0]]}`,'host'); renderAll(); saveGame(); pushState(); },
      spadd:()=>hostDo(p,`+1 sponsorship to ${N}`,()=>{p.sp++;}), spsub:()=>hostDo(p,`−1 sponsorship from ${N}`,()=>{p.sp=Math.max(0,p.sp-1);}),
      ssadd:()=>hostDo(p,`+3 Stream Strength to ${N}`,()=>{p.ss+=3;}), sssub:()=>hostDo(p,`−3 Stream Strength from ${N}`,()=>{p.ss=Math.max(0,p.ss-3);}),
      back:()=>hostDo(p,`moved ${N} back to ${Math.max(1,p.pos-1)}`,()=>{p.pos=Math.max(1,p.pos-1);}), fwd:()=>hostDo(p,`moved ${N} forward to ${Math.min(120,p.pos+1)}`,()=>{p.pos=Math.min(120,p.pos+1);}),
      goto:()=>{ const v=Math.min(120,Math.max(1,+$('rPos').value||p.pos)); hostDo(p,`moved ${N} to ${v}`,()=>{ p.pos=v; for(const cp of [40,80]) if(v>cp&&!p.cleared.includes(cp)) p.cleared.push(cp); }); },
      skip:()=>hostDo(p,`${N} will skip a turn`,()=>{p.skip++;}), unskip:()=>hostDo(p,`cancelled ${N}'s skip`,()=>{p.skip=0;}) };
    el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>A[b.dataset.a]&&A[b.dataset.a]());
    el.querySelectorAll('[data-ctrl]').forEach(b=>b.onclick=()=>{ const v=b.dataset.ctrl; hostDo(p,`${N} is now ${v==='a'?'AI':v==='r'?'an online player':'played on this screen'}`,()=>{p.ai=v==='a'; p.remote=v==='r';}); }); }
  $('rHost').onchange=e=>{ S.settings.hostPresent=e.target.checked; log(`HOST: host judging ${S.settings.hostPresent?'on':'off'}`,'host'); saveGame(); };
  $('rPay').onchange=e=>{ S.settings.allowPay=e.target.checked; log(`HOST: PAY at checkpoints ${S.settings.allowPay?'on':'off'}`,'host'); saveGame(); };
  $('rTips').onchange=e=>{ tipsOn=e.target.checked; try{localStorage.setItem('viral-tips',tipsOn?'on':'off');}catch(x){} if(!tipsOn) hideTip(); };
  $('rSound').onchange=e=>{ SFX.set(e.target.checked); const b=$('btnSound'); if(b&&b.onclick) setupHeaderButtons(); };
  el.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{ S.settings.speed=b.dataset.speed; saveGame(); renderRemote(); }); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('remote').hidden) closeRemote(); });

// ---------- first-game walkthrough (replay any time with the ? button) ----------
const TOUR=[
  {sel:'.boardwrap',t:'Welcome to VIRAL!',b:'<p>Race your creator from space 1 to the <b>Streamer Mansion at space 120</b>. The road spells <b style="color:#18d45b">V</b>-<b style="color:#23aaff">I</b>-<b style="color:#b84cff">R</b>-<b style="color:#ffd35a">A</b>-<b style="color:#ff4a3d">L</b>, and day turns to night as you climb.</p>'},
  {sel:'#turnBox',t:'Your turn bar',b:'<p>It always shows whose turn it is and what to do next. When it <b style="color:var(--berna)">glows orange</b>, it\'s your move — tap the big button to roll the Berna Dice.</p>'},
  {sel:'#players',t:'The scoreboard',b:'<ul><li><b>Big number</b> — followers</li><li><b>8 squares</b> — your gear (TV, camera, mic…)</li><li><b>SS</b> — Stream Strength: spend it to block bad luck</li><li><b>Sponsors</b> — brand deals</li></ul>'},
  {sel:'.camctl',t:'Move the camera',b:'<p><b>City</b>, <b>Table</b> or <b>Flat</b> view. Drag to spin the city, pinch or scroll to zoom. <b>Follow cam</b> keeps up with whoever\'s turn it is; <b>Overview</b> shows the whole board.</p>'},
  {sel:null,t:'Cards pop up on the board',b:'<p>Land on a card space and it flips up right here with the prompt and <b>numbered steps</b> — finish the lyric, read the ad, pitch the idea. Start the timer, perform, and the host taps <b style="color:var(--good)">Nailed it</b> or <b style="color:var(--bad)">Missed it</b>.</p>'},
  {sel:'#btnRemote',t:'Hosting?',b:'<p>The <b>Host</b> button opens the host remote: answer for any player, peek at challenge answers, fix followers, gear and spaces, and change settings. Every change goes in the turn log, and there\'s an Undo.</p>'},
  {sel:null,t:'How to win',b:'<p>Everyone stops at two checkpoints:</p><ul><li><b>Space 40</b> — 1 gear + 2,500 followers</li><li><b>Space 80</b> — 4 gear + 50,000 followers</li></ul><p>To get into the Mansion at <b>120</b> you need <b>all 8 gear</b>, <b>1,000,000 followers</b> and <b>at least 1 sponsorship</b>. Missing anything? Back to space 100.</p>'},
];
let tourI=-1;
function tourDone(){ try{localStorage.setItem('viral-tour','done');}catch(e){} const el=$('tour'); if(el) el.remove(); tourI=-1; document.removeEventListener('keydown',tourKey); }
function tourKey(e){ if(e.key==='Escape') tourDone(); else if(e.key==='ArrowRight') tourGo(tourI+1); else if(e.key==='ArrowLeft') tourGo(tourI-1); }
function startTour(){ const old=$('tour'); if(old) old.remove(); const el=document.createElement('div'); el.className='tour'; el.id='tour'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','How to play');
  el.innerHTML='<div class="tspot"></div><div class="ttip"></div>'; document.body.appendChild(el); document.addEventListener('keydown',tourKey); tourGo(0); }
function tourGo(i){ if(i<0) i=0; if(i>=TOUR.length){ tourDone(); return; } tourI=i; const st=TOUR[i], el=$('tour'); if(!el) return;
  const spot=el.querySelector('.tspot'), tip=el.querySelector('.ttip'); const tgt=st.sel&&document.querySelector(st.sel);
  tip.innerHTML=`<div class="tstep">STEP ${i+1} OF ${TOUR.length}</div><h3>${st.t}</h3>${st.b}<div class="trow2"><div class="dots">${TOUR.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div><span class="sp"></span>${i?'<button type="button" data-t="back">Back</button>':'<button type="button" data-t="skip">Skip</button>'}<button type="button" class="primary" data-t="next">${i===TOUR.length-1?"Let's play":'Next'}</button></div>`;
  tip.querySelector('[data-t="next"]').onclick=()=>tourGo(i+1); const bk=tip.querySelector('[data-t="back"]'); if(bk) bk.onclick=()=>tourGo(i-1); const sk=tip.querySelector('[data-t="skip"]'); if(sk) sk.onclick=tourDone;
  const vw=innerWidth, vh=innerHeight, tw=Math.min(380,vw-24);
  if(tgt&&tgt.offsetParent!==null){ const r=tgt.getBoundingClientRect(), pad=6; const L=Math.max(4,r.left-pad), T=Math.max(4,r.top-pad), W=Math.min(vw-8,r.width+pad*2), H=Math.min(vh-8,r.height+pad*2);
    spot.classList.remove('none'); Object.assign(spot.style,{left:L+'px',top:T+'px',width:W+'px',height:H+'px'});
    const th=tip.offsetHeight||240; let top, left=Math.min(Math.max(12,r.left+r.width/2-tw/2),vw-tw-12);
    if(r.bottom+th+16<vh) top=r.bottom+12; else if(r.top-th-16>0) top=r.top-th-12; else { top=Math.max(12,Math.min(vh-th-12,r.top+r.height/2-th/2)); left=r.right+tw+16<vw?r.right+12:r.left-tw-12>0?r.left-tw-12:(vw-tw)/2; }
    Object.assign(tip.style,{left:left+'px',top:top+'px'}); }
  else { spot.classList.add('none'); const th=tip.offsetHeight||260; Object.assign(tip.style,{left:((vw-tw)/2)+'px',top:Math.max(12,(vh-th)/2)+'px'}); }
  tip.querySelector('[data-t="next"]').focus({preventScroll:true}); }
addEventListener('resize',()=>{ if(tourI>=0) tourGo(tourI); });
function maybeTour(){ let seen=false; try{seen=localStorage.getItem('viral-tour')==='done';}catch(e){} if(!seen) setTimeout(()=>{ if(S&&S.started&&!$('tour')) startTour(); },900); }
function setupHeaderButtons(){ const bs=$('btnSound'), bh=$('btnHelp');
  const paint=()=>{ bs.setAttribute('aria-pressed',SFX.on); bs.title=SFX.on?'Sound on — tap to mute':'Sound off — tap to turn on'; bs.setAttribute('aria-label',bs.title);
    bs.innerHTML=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/>${SFX.on?'<path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/>':'<path d="m22 9-6 6"/><path d="m16 9 6 6"/>'}</svg>`; };
  bs.onclick=()=>{ SFX.set(!SFX.on); paint(); if(SFX.on) SFX.play('click'); }; bh.onclick=startTour; paint(); const br=$('btnRemote'); if(br) br.onclick=()=>{ if($('remote').hidden) openRemote(); else closeRemote(); }; }

start();
