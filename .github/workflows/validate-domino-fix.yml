name: Validate Dominoes backend fix

on:
  push:
    branches:
      - fix/dominoes-remove-base44
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check Railway server syntax
        run: node --check server.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
