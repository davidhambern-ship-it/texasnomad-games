name: Validate live Word Wrangler

on:
  push:
    branches:
      - test/word-wrangler-live-validation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Run deterministic engine simulation
        run: node scripts/word-wrangler-sim.mjs

      - name: Run live multiplayer simulation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import * as E from './src/lib/wordWranglerEngine.js';

          const BASE = 'https://tng-live-production.up.railway.app/ww-api';

          async function req(path, { method = 'GET', token = '', body, expect } = {}) {
            const res = await fetch(BASE + path, {
              method,
              headers: {
                Accept: 'application/json',
                ...(token ? { 'X-WW-Token': token } : {}),
                ...(body !== undefined ? { 'Content-Type': 'application/json' } : {}),
              },
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            const json = await res.json().catch(() => ({}));
            const ok = expect === undefined
              ? res.ok
              : (Array.isArray(expect) ? expect.includes(res.status) : res.status === expect);
            if (!ok) throw new Error(`${method} ${path} -> ${res.status}: ${JSON.stringify(json)}`);
            return { status: res.status, json };
          }

          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const log = (name, value) => console.log(`WW_SIM ${name} ${JSON.stringify(value)}`);

          const words = fs.readFileSync('./public/word-wrangler/words.txt', 'utf8').split('\n').map(s => s.trim()).filter(Boolean);
          const common = new Set(fs.readFileSync('./public/word-wrangler/cpu.txt', 'utf8').split('\n').map(s => s.trim()).filter(Boolean));
          const dict = new Set(words);
          const trie = E.buildTrie(words);

          const health = await req('/health', { expect: 200 });
          log('health', health.json);
          if (!health.json.ok || health.json.service !== 'word-wrangler') throw new Error('Word Wrangler health failed');

          // Host creates real live room.
          const created = await req('/rooms', {
            method: 'POST',
            body: { name: 'HostSim' },
            expect: 200,
          });
          const code = created.json.roomCode;
          const hostToken = created.json.token;
          const hostId = created.json.playerId;
          if (!/^[A-Z]{5}$/.test(code) || !hostToken || !hostId) throw new Error('Host room/token/player missing');
          log('room_created', { code, hostId, phase: created.json.room?.phase });

          // Public resolution: central TNG Join relies on this.
          const publicRoom = await req(`/rooms/${code}`, { expect: 200 });
          if (publicRoom.json.room?.code !== code) throw new Error('Public room-code resolution failed');
          log('public_resolution', { code, players: publicRoom.json.room.players.map(p => p.name) });

          // Join 3 human players.
          const players = [];
          for (let i = 1; i <= 3; i++) {
            const j = await req(`/rooms/${code}/action`, {
              method: 'POST',
              body: { action: 'join', name: `Player${i}` },
              expect: 200,
            });
            if (!j.json.token || !j.json.playerId) throw new Error(`Player${i} did not get a seat`);
            players.push({ name: `Player${i}`, token: j.json.token, id: j.json.playerId });
          }
          log('players_joined', players.map(({name,id}) => ({name,id})));

          // Host changes duration and starts.
          await req(`/rooms/${code}/action`, {
            method: 'POST',
            token: hostToken,
            body: { action: 'setDuration', seconds: 90 },
            expect: 200,
          });
          const started = await req(`/rooms/${code}/action`, {
            method: 'POST',
            token: hostToken,
            body: { action: 'start' },
            expect: 200,
          });
          if (started.json.room?.phase !== 'countdown' || !started.json.room?.seed) {
            throw new Error('Race did not start correctly');
          }
          const seed = started.json.room.seed;
          log('started', {
            phase: started.json.room.phase,
            seed,
            round: started.json.room.round,
            playerCount: started.json.room.players.length,
          });

          await sleep(4300);
          const live = await req(`/rooms/${code}`, { token: players[0].token, expect: 200 });
          if (live.json.room?.phase !== 'playing') throw new Error(`Expected playing, got ${live.json.room?.phase}`);

          // Reconstruct player board from shared seed and submit a real legal word.
          let st = E.createGame({ seed, mode: 'race' });
          const pick = E.cpuPickWord(st, trie, 9, { common });
          if (!pick) throw new Error('Could not find a legal word for live simulation');
          const local = E.applyWord(st, pick.path, dict);
          if (!local.ok) throw new Error(`Local engine rejected selected word: ${pick.word}`);

          const played = await req(`/rooms/${code}/action`, {
            method: 'POST',
            token: players[0].token,
            body: { action: 'word', path: pick.path, move: 0 },
            expect: 200,
          });
          if (!played.json.result?.ok) throw new Error(`Server rejected legal word: ${JSON.stringify(played.json.result)}`);
          log('legal_word', {
            word: pick.word,
            localPoints: local.points,
            serverResult: played.json.result,
            score: played.json.mine?.score,
          });
          if (Number(played.json.mine?.score) !== Number(local.state.score)) {
            throw new Error(`Server replay score mismatch: server=${played.json.mine?.score}, local=${local.state.score}`);
          }

          // Second client makes a valid shuffle move; server increments its move counter.
          const shuffled = await req(`/rooms/${code}/action`, {
            method: 'POST',
            token: players[1].token,
            body: { action: 'shuffle', move: 0 },
            expect: 200,
          });
          if (!shuffled.json.result?.ok || shuffled.json.mine?.moves !== 1) {
            throw new Error('Live shuffle replay failed');
          }
          log('shuffle', { result: shuffled.json.result, moves: shuffled.json.mine.moves });

          // Shared leaderboard reflects first player's validated score.
          const observed = await req(`/rooms/${code}`, { token: players[2].token, expect: 200 });
          const scorer = observed.json.room.players.find(p => p.id === players[0].id);
          if (!scorer || scorer.score !== local.state.score || scorer.words !== 1) {
            throw new Error(`Shared leaderboard mismatch: ${JSON.stringify(scorer)}`);
          }
          log('shared_state', { scorer: { name: scorer.name, score: scorer.score, words: scorer.words } });

          // Capacity: host + 7 joins accepted, next player rejected (8 max total).
          const cap = await req('/rooms', { method: 'POST', body: { name: 'CapHost' }, expect: 200 });
          for (let i = 1; i <= 7; i++) {
            await req(`/rooms/${cap.json.roomCode}/action`, {
              method: 'POST',
              body: { action: 'join', name: `Cap${i}` },
              expect: 200,
            });
          }
          const ninth = await req(`/rooms/${cap.json.roomCode}/action`, {
            method: 'POST',
            body: { action: 'join', name: 'Cap8' },
            expect: 409,
          });
          if (ninth.json.error?.code !== 'FULL') throw new Error('9th total player was not rejected as FULL');
          log('capacity', {
            room: cap.json.roomCode,
            totalAccepted: 8,
            rejectedStatus: ninth.status,
            rejectedError: ninth.json.error,
          });

          console.log('WW_SIM OVERALL {"passed":true,"tests":["health","room-create","public-code-resolution","3-player-join","start","playing","legal-word-server-replay","shuffle","shared-leaderboard","8-player-capacity"]}');
          NODE
