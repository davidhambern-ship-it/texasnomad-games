name: Validate VIRAL display host detection

on:
  push:
    branches:
      - fix/viral-display-host-detection

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check bridge syntax
        run: |
          node --check public/viral/tng-bridge.js
          node --check server.mjs
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify bridge injection
        run: |
          test -s dist/viral/tng-bridge.js
          grep -q 'data?.session?.token' dist/viral/tng-bridge.js
          grep -q 'detectHostMode' dist/viral/tng-bridge.js
