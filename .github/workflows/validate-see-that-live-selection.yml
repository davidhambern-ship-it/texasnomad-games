name: Validate See That live selection

on:
  push:
    branches:
      - fix/see-that-main-live

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check See That live classification
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s = fs.readFileSync('src/pages/Games.jsx', 'utf8');
          if (/IN_CONSTRUCTION_IDS\s*=\s*\[[^\]]*see-that/.test(s)) {
            throw new Error('See That is still marked under construction');
          }
          if (!s.includes("navigate('/games/see-that?host=1')")) {
            throw new Error('See That main launch is not wired to host mode');
          }
          if (!s.includes("launchLabel: '⚡ HOST LIVE GAME'")) {
            throw new Error('See That live host label missing');
          }
          NODE
      - name: Check server syntax
        run: |
          node --check server.mjs
          node --check server/seeThatApi.mjs
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
