name: Validate Word Wrangler rebuild

on:
  push:
    branches:
      - integrate/word-wrangler-rebuild

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Word Wrangler files and live wiring
        run: |
          test -s public/word-wrangler/words.txt
          test -s public/word-wrangler/cpu.txt
          test -s server/wordWranglerApi.mjs
          test -s src/lib/wordWranglerEngine.js
          test -s src/api/wordWranglerApi.js
          test -s src/components/wordWrangler/WWOnline.jsx
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const games = fs.readFileSync('src/pages/Games.jsx', 'utf8');
          const join = fs.readFileSync('src/pages/JoinRoom.jsx', 'utf8');
          const server = fs.readFileSync('server.mjs', 'utf8');
          const host = fs.readFileSync('src/components/host/HostGameSelect.jsx', 'utf8');
          const online = fs.readFileSync('src/components/wordWrangler/WWOnline.jsx', 'utf8');

          if (/IN_CONSTRUCTION_IDS\s*=\s*\[[^\]]*word-wrangler/.test(games)) throw new Error('Word Wrangler still under construction');
          if (!join.includes('resolveWordWranglerRoom')) throw new Error('Central Join resolver missing');
          if (!server.includes("startsWith('/ww-api')")) throw new Error('/ww-api route missing');
          if (!host.includes("id: 'word-wrangler'")) throw new Error('Host Panel Word Wrangler missing');
          if (online.includes('window.location.origin')) throw new Error('Preview/sandbox invite URL leak remains');
          if (!online.includes("'https://texasnomadgames.com'")) throw new Error('Public TNG invite origin missing');
          NODE

      - name: Check server and engine syntax
        run: |
          node --check server.mjs
          node --check server/wordWranglerApi.mjs
          node --check src/lib/wordWranglerEngine.js
          node --check src/api/wordWranglerApi.js

      - name: Install dependencies
        run: npm ci

      - name: Run Word Wrangler engine simulation
        run: node scripts/word-wrangler-sim.mjs

      - name: Production build
        run: npm run build

      - name: Verify built Word Wrangler assets
        run: |
          test -s dist/word-wrangler/words.txt
          test -s dist/word-wrangler/cpu.txt
