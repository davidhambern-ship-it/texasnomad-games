name: TNG Verify

on:
  push:
    branches: [main, migration/off-railway-guest-platform]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tng-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, static checks, and game simulations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve patched dependency lockfile
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify TNG
        run: npm run ci:verify

      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high

      - name: Commit compatible lockfile security updates
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'migration/off-railway-guest-platform'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No compatible lockfile updates were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: update compatible vulnerable dependencies"
          git push origin "HEAD:refs/heads/${{ github.head_ref }}"

  production-smoke:
    name: Production release certification
    if: always() && ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/migration/off-railway-guest-platform')) || (github.event_name == 'pull_request' && github.head_ref == 'migration/off-railway-guest-platform'))
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for exact commit and smoke production
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: npm run smoke:production
