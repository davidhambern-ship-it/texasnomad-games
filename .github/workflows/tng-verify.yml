name: TNG Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tng-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, static checks, and game simulations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify TNG
        run: npm run ci:verify

      - name: Capture production dependency audit
        if: always()
        run: npm audit --omit=dev --json > npm-audit-production.json || true

      - name: Upload production dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-production
          path: npm-audit-production.json
          retention-days: 1

      - name: Generate safe dependency remediation preview
        if: always()
        run: |
          npm audit fix --package-lock-only --omit=dev || true
          npm audit --omit=dev --json > npm-audit-after-safe-fix.json || true
          npx --yes depcheck@1.4.7 --json > depcheck.json || true

      - name: Upload dependency remediation preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-preview
          path: |
            package-lock.json
            npm-audit-after-safe-fix.json
            depcheck.json
          retention-days: 1

      - name: Apply safe dependency cleanup
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'run dependency cleanup')
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const name of ['react-quill', 'lodash', 'moment']) {
            delete pkg.dependencies[name];
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --legacy-peer-deps
          npm audit fix --package-lock-only --omit=dev || true
          npm ci --legacy-peer-deps
          npm run ci:verify
          npm audit --omit=dev --json > npm-audit-final.json || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Phase 15: apply safe dependency cleanup"
          git push

  production-smoke:
    name: Production release certification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for exact commit and smoke production
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: npm run smoke:production
