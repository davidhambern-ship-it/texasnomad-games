name: TNG Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tng-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, static checks, and game simulations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify TNG
        run: npm run ci:verify

      - name: Capture production dependency audit
        if: always()
        run: npm audit --omit=dev --json > npm-audit-production.json || true

      - name: Upload production dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-production
          path: npm-audit-production.json
          retention-days: 1

  production-smoke:
    name: Production release certification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for exact commit and smoke production
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: npm run smoke:production
