name: Validate rebuilt See That

on:
  push:
    branches:
      - integrate/see-that-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check server syntax
        run: |
          node --check server.mjs
          node --check server/seeThatApi.mjs
          node --check src/lib/seeThatEngine.js
          node --check src/api/seeThatApi.js
      - name: Verify See That assets
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = 'public/see-that/objects/objects.json';
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          const missing = data.objects
            .map(o => o.file)
            .filter(file => !fs.existsSync('public/see-that/objects/' + file));
          if (missing.length) {
            console.error('Missing object sprites:', missing);
            process.exit(1);
          }
          if (!fs.existsSync('public/see-that/scenes/tng-mall.jpg')) process.exit(2);
          if (!fs.existsSync('public/see-that/scenes/tng-mall.json')) process.exit(3);
          console.log('See That objects:', data.objects.length);
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Verify built See That assets
        run: |
          test -s dist/see-that/scenes/tng-mall.jpg
          test -s dist/see-that/scenes/tng-mall.json
          test -s dist/see-that/objects/objects.json
          test -s dist/see-that/objects/fries.webp
          test -s dist/see-that/objects/binoculars.webp
          test -s dist/see-that/objects/tn-chip-3.webp
