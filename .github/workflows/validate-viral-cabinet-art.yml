name: Validate VIRAL cabinet art

on:
  push:
    branches:
      - fix/viral-cabinet-art

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify VIRAL art references
        run: |
          grep -q 'VIRAL_Cabinet_Image.png' src/pages/Games.jsx
          grep -q 'VIRAL_Cabinet_Image.png' src/components/host/HostGameSelect.jsx
          grep -q 'game.image' src/pages/PreviewHostPanel.jsx
