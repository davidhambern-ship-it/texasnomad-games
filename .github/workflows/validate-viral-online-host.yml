name: Validate VIRAL online host bridge

on:
  push:
    branches:
      - fix/viral-online-host-bridge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check integration syntax
        run: |
          node --check public/viral/tng-bridge.js
          node --check server/viralLive.mjs
          node --check server.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Confirm VIRAL bridge is injected
        run: |
          test -s dist/viral/index.html
          test -s dist/viral/tng-bridge.js
          grep -q 'tng-bridge.js' dist/viral/index.html
