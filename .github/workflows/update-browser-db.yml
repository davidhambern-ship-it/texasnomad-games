name: Refresh Browserslist Data

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'Phase 15: refresh browser compatibility data'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Refresh Browserslist database
        run: npx update-browserslist-db@latest

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Browser compatibility data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Phase 15: update browser compatibility data"
          git push
