name: Live See That simulation

on:
  push:
    branches:
      - test/see-that-live-simulation

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run live multiplayer simulation
        shell: bash
        run: |
          node <<'NODE'
          const BASE = 'https://tng-live-production.up.railway.app/st-api';

          async function req(path, { method = 'GET', token = '', body, expect } = {}) {
            const res = await fetch(BASE + path, {
              method,
              headers: {
                Accept: 'application/json',
                ...(token ? { 'X-ST-Token': token } : {}),
                ...(body !== undefined ? { 'Content-Type': 'application/json' } : {}),
              },
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            const json = await res.json().catch(() => ({}));
            if (expect !== undefined) {
              const ok = Array.isArray(expect) ? expect.includes(res.status) : res.status === expect;
              if (!ok) throw new Error(`${method} ${path}: expected ${expect}, got ${res.status}: ${JSON.stringify(json)}`);
            } else if (!res.ok) {
              throw new Error(`${method} ${path}: ${res.status}: ${JSON.stringify(json)}`);
            }
            return { status: res.status, json };
          }

          const log = (name, value) => console.log(`SIM_RESULT ${name} ${JSON.stringify(value)}`);
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          // 1) Health
          const health = await req('/health', { expect: 200 });
          log('health', health.json);
          if (!health.json.ok || health.json.service !== 'see-that' || Number(health.json.scenes) < 1) {
            throw new Error('See That health/scenes check failed');
          }

          // 2) Four-player normal live room
          const created = await req('/rooms', { method: 'POST', body: {}, expect: 200 });
          const code = created.json.roomCode;
          const hostToken = created.json.token;
          if (!/^[A-Z]{5}$/.test(code) || !hostToken) throw new Error('Room creation did not issue expected code/token');
          log('room_created', { code, phase: created.json.room?.phase });

          const players = [];
          for (let i = 1; i <= 4; i++) {
            const joined = await req(`/rooms/${code}/action`, {
              method: 'POST',
              body: { action: 'join', name: `Sim${i}` },
              expect: 200,
            });
            if (!joined.json.token || !joined.json.playerId) throw new Error(`Sim${i} did not receive a player seat`);
            players.push({ name: `Sim${i}`, token: joined.json.token, id: joined.json.playerId });
          }
          log('players_joined', players.map(p => ({ name: p.name, id: p.id })));

          // 3) Unauthenticated room-code resolution -- same operation the central Join resolver depends on.
          const publicResolve = await req(`/rooms/${code}`, { expect: 200 });
          log('room_code_resolves_publicly', {
            code,
            phase: publicResolve.json.room?.phase,
            players: publicResolve.json.room?.players?.map(p => p.name),
          });
          if (publicResolve.json.room?.players?.length !== 4) throw new Error('Public room resolution did not expose all joined players');

          // Short one-round live test.
          await req(`/rooms/${code}/action`, {
            method: 'POST',
            token: hostToken,
            body: { action: 'settings', count: 6, seconds: 30, rounds: 1, difficulty: 'normal', sceneId: 'tng-mall' },
            expect: 200,
          });
          const start = await req(`/rooms/${code}/action`, {
            method: 'POST',
            token: hostToken,
            body: { action: 'start' },
            expect: 200,
          });
          log('round_started', {
            phase: start.json.room?.phase,
            roundNo: start.json.room?.roundNo,
            startsAt: start.json.room?.startsAt,
            targetCount: start.json.room?.targets?.length,
            placementCount: start.json.room?.placements?.length,
          });
          if (start.json.room?.phase !== 'countdown') throw new Error('Round did not enter countdown');

          await sleep(4400);
          const live = await req(`/rooms/${code}`, { token: hostToken, expect: 200 });
          if (live.json.room?.phase !== 'playing') throw new Error(`Round did not enter playing phase; got ${live.json.room?.phase}`);

          const room = live.json.room;
          const target = room.targets[0];
          const placement = room.placements.find(p => p.key === target.id);
          if (!target || !placement) throw new Error('Could not map target to dynamic scene placement');
          const H = room.scene.height;
          const rr = Math.abs(Number(placement.rot || 0)) * Math.PI / 180;
          const bh = Number(placement.ph) * Math.cos(rr) + Number(placement.pw) * Math.sin(rr);
          const hitX = Number(placement.bx);
          const hitY = Number(placement.by) - bh / (2 * H);

          // 4) Same-object race: two clients claim the same target concurrently.
          const [raceA, raceB] = await Promise.all([
            req(`/rooms/${code}/action`, {
              method: 'POST', token: players[0].token,
              body: { action: 'tap', x: hitX, y: hitY, round: room.roundNo }, expect: 200,
            }),
            req(`/rooms/${code}/action`, {
              method: 'POST', token: players[1].token,
              body: { action: 'tap', x: hitX, y: hitY, round: room.roundNo }, expect: 200,
            }),
          ]);
          const raceKinds = [raceA.json.result?.kind, raceB.json.result?.kind].sort();
          log('same_target_race', {
            target: target.name,
            coordinate: [hitX, hitY],
            results: [
              { player: players[0].name, result: raceA.json.result },
              { player: players[1].name, result: raceB.json.result },
            ],
          });
          if (!raceKinds.includes('found') || !raceKinds.includes('already')) {
            throw new Error(`Race safety failed: expected found+already, got ${raceKinds.join(',')}`);
          }

          // 5) Miss + hint on another client.
          const miss = await req(`/rooms/${code}/action`, {
            method: 'POST', token: players[2].token,
            body: { action: 'tap', x: 0.01, y: 0.01, round: room.roundNo }, expect: 200,
          });
          log('miss', miss.json.result);
          if (miss.json.result?.kind !== 'miss') throw new Error(`Expected miss, got ${miss.json.result?.kind}`);

          const hint = await req(`/rooms/${code}/action`, {
            method: 'POST', token: players[2].token,
            body: { action: 'hint', round: room.roundNo }, expect: 200,
          });
          log('hint', hint.json.result);
          if (hint.json.result?.kind !== 'hint') throw new Error(`Expected hint, got ${hint.json.result?.kind}`);

          // 6) A different client sees the shared find/score state.
          const observer = await req(`/rooms/${code}`, { token: players[3].token, expect: 200 });
          const sharedTarget = observer.json.room.targets.find(t => t.id === target.id);
          log('shared_state', {
            targetFound: sharedTarget?.found,
            players: observer.json.room.players.map(p => ({ name: p.name, total: p.total, finds: p.finds })),
          });
          if (!sharedTarget?.found) throw new Error('Observer did not see the claimed target');

          // 7) Capacity test: 12 joins work; 13th is rejected.
          const cap = await req('/rooms', { method: 'POST', body: {}, expect: 200 });
          const capCode = cap.json.roomCode;
          for (let i = 1; i <= 12; i++) {
            await req(`/rooms/${capCode}/action`, {
              method: 'POST', body: { action: 'join', name: `Cap${i}` }, expect: 200,
            });
          }
          const thirteenth = await req(`/rooms/${capCode}/action`, {
            method: 'POST', body: { action: 'join', name: 'Cap13' }, expect: 409,
          });
          log('capacity', {
            room: capCode,
            first12: 'accepted',
            thirteenthStatus: thirteenth.status,
            thirteenthError: thirteenth.json.error,
          });
          if (thirteenth.json.error?.code !== 'FULL') throw new Error('13th player was not rejected as FULL');

          console.log('SIM_RESULT OVERALL {"passed":true,"tests":["health","room-create","4-player-join","public-code-resolution","start","playing","concurrent-claim","miss","hint","shared-state","12-player-capacity"]}');
          NODE
