name: TNG Dependency Security Refresh

on:
  push:
    branches: [codex/guest-room-lifecycle]

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh, test, and lock patched production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve package updates into the lockfile
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts

      - name: Install exact locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify build, lint, types, lifecycle, and game simulations
        run: npm run ci:verify

      - name: Require a clean production dependency audit
        run: npm audit --omit=dev --audit-level=low

      - name: Record installed security-fix versions
        run: npm ls --all better-auth @better-auth/drizzle-adapter @better-auth/kysely-adapter zod react-router react-router-dom dompurify fast-uri @react-email/render html-to-text deepmerge

      - name: Commit the verified lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: lock patched production dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
